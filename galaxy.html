<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIZMA GALAXY</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#283d72,#080c22 75%);color:#fff;font:16px Arial;min-height:100vh}main{max-width:1050px;margin:auto;padding:24px}h1{text-align:center;color:#ffdb98;font-size:clamp(30px,6vw,65px)}a{color:#d6b9ff}section{background:#ffffff09;border:1px solid #ad83cc66;border-radius:22px;padding:20px;margin:18px 0}button,input,textarea,select{font:inherit;background:#2c214b;color:white;border:1px solid #a488d0;border-radius:12px;padding:12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}textarea,input{width:100%;margin:8px 0}textarea{min-height:100px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:15px;margin:24px 0}.door{height:170px;border-radius:65px 65px 10px 10px;border:2px solid #e7bd73;box-shadow:0 0 20px #d9a7ff66,inset 0 0 25px #a575e844;background:linear-gradient(100deg,#261344,#654184,#241340);font-size:34px;transition:transform .3s}.door:hover:not(:disabled){transform:translateY(-7px)}.door.open{animation:glow .65s ease}@keyframes glow{50%{transform:scale(1.08);box-shadow:0 0 65px #ffdb86}}#reveal{text-align:center;font-size:clamp(22px,4vw,38px);color:#ffda86;min-height:70px}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.group{padding:15px;border:1px solid var(--c);border-radius:15px;background:#ffffff09}.group h3{color:var(--c)}li{margin:7px 0;overflow-wrap:anywhere}[hidden]{display:none!important}@media print{body{background:white;color:black}#setup,#play,#actions,header,a{display:none!important}.group{border:1px solid #444}.group h3{color:black}section{border:0}}</style><main><header><a href="index.html">← PRIZMA</a><p>◈ PRIZMA / 008</p></header><h1>✦ PRIZMA GALAXY ✦</h1><p style="text-align:center">Әр білім алушы — бір жұлдыз</p><section id="setup"><label>Білім алушылар (әр жолға бір есім немесе бүркеншік ат)<textarea id="names" placeholder="Аружан&#10;Дана&#10;Әли"></textarea></label><label>Топ саны <select id="count"></select></label><div id="labels"></div><div class="row"><button id="start">Ғарыштық саяхатты бастау</button><button id="load">Сақталған нәтижені ашу</button></div><p id="status" aria-live="polite"></p><small>Тізім серверге жіберілмейді. Сақтау осы браузерде ғана жүргізіледі.</small></section><section id="play" hidden><p id="progress"></p><div id="sky" style="position:relative;height:420px;overflow:hidden;background:radial-gradient(ellipse at 30% 20%,#453078,#101c49 45%,#070b20 85%);border-radius:20px"></div><div id="reveal" aria-live="polite"></div><button id="sound">🔊 Дыбыс</button></section><section id="results" hidden><h2>Топтар құрамы</h2><div id="groups" class="groups"></div><div class="row" id="actions" style="margin-top:18px"><button id="save">Нәтижені сақтау</button><button id="again">Қайта бөлу</button><button id="edit">Тізімді өзгерту</button><button id="print">Басып шығару</button></div><p id="notice"></p></section></main><script>
const $=id=>document.getElementById(id),key='prizma-galaxy-v1',colors=['#c5a4ff','#62ddee','#ffcf75','#ff92b0','#8be7af','#87a9ff','#f6a778','#dacbff'];let names=[],labels=[],groups=[],pool=[],remaining=[],sound=true,ctx,flight=0;function el(t,txt,p){let e=document.createElement(t);if(txt!==null)e.textContent=txt;p.append(e);return e}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}for(let i=2;i<=8;i++)el('option',String(i),$('count')).value=i;$('count').value=3;function fields(){let prev=Array.from($('labels').querySelectorAll('input')).map(x=>x.value);$('labels').replaceChildren();for(let i=0;i<Number($('count').value);i++){let n=el('input',null,$('labels'));n.value=prev[i]||['Сириус','Вега','Орион','Альтаир','Кассиопея','Андромеда','Лира','Феникс'][i];n.setAttribute('aria-label',(i+1)+'-топ атауы')}}fields();$('count').onchange=fields;function tone(){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();[440,660,880].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.12;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.3)})}catch{}}function start(){let token=++flight;groups=labels.map(()=>[]);let order=shuffle(labels.map((_,i)=>i));pool=shuffle(names.map((_,i)=>order[i%labels.length]));remaining=names.map((_,i)=>i);$('setup').hidden=true;$('play').hidden=false;$('results').hidden=true;$('notice').textContent='';$('reveal').textContent='Жұлдыздар ғарышта қозғалып жатыр…';$('progress').textContent=names.length+' жұлдыз · '+labels.length+' шоқжұлдыз';let sky=$('sky');sky.replaceChildren();for(let j=0;j<65;j++){let z=el('span','·',sky);z.style.cssText='position:absolute;color:#ffffff88;pointer-events:none;left:'+Math.random()*98+'%;top:'+Math.random()*98+'%;font-size:'+((j%3+1)*7)+'px'}let cols=Math.min(labels.length,4),rows=Math.ceil(labels.length/cols);let centers=labels.map((l,i)=>({x:(i%cols+.5)*100/cols,y:(Math.floor(i/cols)+.5)*100/rows}));centers.forEach((c,i)=>{let z=el('div',ltext(i),sky);z.style.cssText='position:absolute;left:'+c.x+'%;top:'+c.y+'%;transform:translate(-50%,-50%);width:22%;height:'+Math.min(40,80/rows)+'%;border:1px solid '+colors[i]+';border-radius:50%;display:grid;place-items:center;color:'+colors[i]+';font-weight:bold;text-align:center;box-shadow:0 0 24px '+colors[i]+'55;font-size:13px'});let stars=names.map((n,i)=>{let z=el('span','✦ '+n,sky);z.style.cssText='position:absolute;left:'+Math.random()*85+'%;top:'+Math.random()*90+'%;font-size:12px;color:white;text-shadow:0 0 9px white;transition:left 2s ease,top 2s ease,color 1s,opacity 1s;white-space:nowrap;max-width:20%;overflow:hidden;text-overflow:ellipsis';return z});tone();setTimeout(()=>{if(token!==flight)return;stars.forEach((z,i)=>{let k=pool[i],c=centers[k];z.style.left=Math.max(1,Math.min(86,c.x-6+(Math.random()-.5)*16))+'%';z.style.top=Math.max(1,Math.min(95,c.y+(Math.random()-.5)*22))+'%';z.style.color=colors[k]});tone()},650);setTimeout(()=>{if(token!==flight)return;names.forEach((n,i)=>groups[pool[i]].push(n));remaining=[];pool=[];$('results').hidden=false;$('reveal').textContent='Шоқжұлдыздар қалыптасты!';$('progress').textContent='Барлығы топқа бөлінді!';render();tone()},3000)}function ltext(i){return '✦ '+labels[i]}function render(){$('groups').replaceChildren();groups.forEach((g,i)=>{let card=el('div',null,$('groups'));card.className='group';card.style.setProperty('--c',colors[i]);el('h3',labels[i]+' · '+g.length,card);let ul=el('ol',null,card);g.forEach(n=>el('li',n,ul))});$('save').disabled=remaining.length>0;$('print').disabled=remaining.length>0;}$('start').onclick=()=>{let n=$('names').value.split(/\n/).map(x=>x.trim()).filter(Boolean),l=Array.from($('labels').querySelectorAll('input')).map(x=>x.value.trim());if(n.length<l.length||n.length>200||l.some(x=>!x)||new Set(l).size!==l.length){$('status').textContent='2–200 есім енгізіңіз. Адам саны топ санынан кем болмауы және топ атаулары бірегей болуы керек.';return}names=n;labels=l;start()};$('again').onclick=start;$('edit').onclick=()=>{flight++;$('setup').hidden=false;$('play').hidden=true;$('results').hidden=true};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Дыбыс':'🔇 Дыбыс'};$('print').onclick=()=>window.print();$('save').onclick=()=>{if(remaining.length)return;try{localStorage.setItem(key,JSON.stringify({names,labels,groups}));$('notice').textContent='Нәтиже сақталды.'}catch{$('notice').textContent='Сақтау мүмкін болмады.'}};$('load').onclick=()=>{try{let d=JSON.parse(localStorage.getItem(key));if(!d||!Array.isArray(d.names)||!Array.isArray(d.labels)||!Array.isArray(d.groups)||d.groups.length!==d.labels.length)throw Error();({names,labels,groups}=d);remaining=[];pool=[];$('names').value=names.join('\n');$('count').value=labels.length;fields();Array.from($('labels').querySelectorAll('input')).forEach((x,i)=>x.value=labels[i]);$('setup').hidden=true;$('play').hidden=true;$('results').hidden=false;render();$('notice').textContent='Сақталған нәтиже ашылды.'}catch{$('status').textContent='Сақталған нәтиже табылмады.'}};</script></html>

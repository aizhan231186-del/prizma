<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIZMA CRYSTAL</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#23365a,#090e20 65%);color:#eff5ff;font:16px system-ui;min-height:100vh}main{max-width:1100px;margin:auto;padding:24px}h1{letter-spacing:4px;color:#d4edff}small{color:#9eb2d0}section,article{background:#ffffff09;border:1px solid #ffffff24;border-radius:18px;padding:18px;margin:15px 0}input,select,button{font:inherit;border-radius:9px;padding:10px;background:#17243e;color:white;border:1px solid #536487}button{cursor:pointer;background:#344773}button:hover{filter:brightness(1.3)}input{max-width:100%}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}article{margin:0}.gem{background:#101b31;border-color:var(--c);color:var(--c);min-width:42px;padding:8px}.gem svg{width:32px;height:30px;display:block;margin:auto;filter:drop-shadow(0 0 5px var(--c))}.bar{height:8px;background:#26334c;border-radius:8px;overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,#42c8c4,#bb94ff)}label{display:block;margin:8px 0}#status{color:#7ce6bd}button.danger{background:#63334a}details{margin:10px 0}summary{cursor:pointer} @media print{button,input,select,details,#setup{display:none}body{background:white;color:black}article{border:1px solid #aaa}}</style><main><small>PRIZMA / 003</small><h1>💎 CRYSTAL</h1><p>Әр жетістік – бір асыл тас.</p><section id="setup"><div class="row"><input id="subject" placeholder="Пән атауы"><input id="topic" placeholder="Сабақ тақырыбы"><select id="mode"><option>Жеке бағалау</option><option>Топтық бағалау</option></select></div><details><summary>Бағалау критерийлері мен ұпайлар</summary><div id="criteria"></div></details><div class="row"><input id="person" placeholder="Студент немесе топ атауы"><button id="add">Қосу</button></div><p><small>Жеке деректерді жарияламаңыз. Қысқа бүркеншік атаулар қолдануға болады.</small></p></section><section><div class="row"><button id="save">Сақтау</button><button id="fresh">Жаңа сабақ</button><select id="library"></select><button id="load">Ашу</button><button id="csv">Нәтижені жүктеу</button><button onclick="print()">Басып шығару</button></div><p id="status" role="status"></p></section><h2 id="heading"></h2><div id="cards" class="cards"></div><section><h2>Сабақ қорытындысы</h2><div id="summary"></div></section></main><script>
const $=id=>document.getElementById(id), colors=['#30df9d','#339bff','#bd72ff','#ff426e','#b9edff'], names=['Изумруд','Сапфир','Аметист','Рубин','Алмаз'];const blank=()=>({id:null,subject:'',topic:'',mode:'Жеке бағалау',criteria:names.map((name,i)=>({name,points:(i+1)*2,label:['Белсенділік','Дұрыс жауап','Талдау','Шығармашылық','Үздік жұмыс'][i]})),people:[]});let data=blank();const key='prizma-crystal-library-v1';function lib(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function el(tag,t){let e=document.createElement(tag);if(t!=null)e.textContent=t;return e}function score(p){return p.awards.reduce((a,b)=>a+b.points,0)}function setup(){['subject','topic','mode'].forEach(k=>$(k).value=data[k]);$('criteria').replaceChildren();data.criteria.forEach((c,i)=>{let r=el('div');r.className='row';let n=el('span',c.name),l=el('input'),v=el('input');l.value=c.label;l.setAttribute('aria-label',c.name+' критерийі');v.type='number';v.min=1;v.max=100;v.value=c.points;v.setAttribute('aria-label',c.name+' ұпайы');l.oninput=()=>{c.label=l.value;render()};v.onchange=()=>{c.points=Math.max(1,Math.min(100,Number(v.value)||1));v.value=c.points;render()};r.append(n,l,v);$('criteria').append(r)})}function render(){ $('heading').textContent=[data.subject,data.topic].filter(Boolean).join(' · ')||'Бағалау тақтасы';$('cards').replaceChildren();data.people.forEach(p=>{let a=el('article');a.append(el('h3',p.name),el('h2',score(p)+' ұпай'),el('p',p.awards.length+' асыл тас'));let r=el('div');r.className='row';data.criteria.forEach((c,i)=>{let b=el('button');b.className='gem';b.style.setProperty('--c',colors[i]);b.innerHTML=`<svg viewBox="0 0 80 65" aria-hidden="true"><polygon points="17,3 63,3 78,24 40,62 2,24" fill="currentColor"/><path d="M2 24H78M17 3L24 24L40 62L56 24L63 3M24 24L40 3L56 24" fill="none" stroke="white" stroke-opacity=".7"/></svg>`;b.append(el('span','+'+c.points));b.title=c.name+' · '+c.label;b.setAttribute('aria-label',b.title+' '+c.points+' ұпай');b.onclick=()=>{p.awards.push({i,points:c.points});render()};r.append(b)});a.append(r);let history=el('p',names.map((n,i)=>n+': '+p.awards.filter(x=>x.i===i).length).join(' · '));a.append(history);let undo=el('button','Соңғы тасты қайтару');undo.disabled=!p.awards.length;undo.onclick=()=>{p.awards.pop();render()};let del=el('button','Өшіру');del.className='danger';del.onclick=()=>{if(confirm('Қатысушыны өшіру керек пе?')){data.people=data.people.filter(x=>x!==p);render()}};a.append(undo,del);$('cards').append(a)});let s=$('summary');s.replaceChildren();let max=Math.max(1,...data.people.map(score));s.append(el('p','Қатысушылар: '+data.people.length+' · Жалпы ұпай: '+data.people.reduce((a,p)=>a+score(p),0)));[...data.people].sort((a,b)=>score(b)-score(a)).forEach(p=>{s.append(el('p',p.name+' — '+score(p)));let bar=el('div');bar.className='bar';let b=el('b');b.style.width=score(p)/max*100+'%';bar.append(b);s.append(bar)})}function refreshLibrary(){let s=$('library');s.replaceChildren(new Option('Сақталған сабақты таңдаңыз',''));lib().forEach(x=>s.add(new Option([x.subject,x.topic].filter(Boolean).join(' · ')||'Атаусыз сабақ',x.id)));s.value=data.id||''}['subject','topic','mode'].forEach(k=>$(k).oninput=()=>{data[k]=$(k).value;render()});$('add').onclick=()=>{let n=$('person').value.trim();if(!n)return;data.people.push({name:n,awards:[]});$('person').value='';render()};$('save').onclick=()=>{let a=lib();data.id=data.id||String(Date.now());a=a.filter(x=>x.id!==data.id);a.push(data);try{localStorage.setItem(key,JSON.stringify(a));refreshLibrary();$('status').textContent='Сабақ сақталды.'}catch{$('status').textContent='Сақтау мүмкін болмады.'}};$('fresh').onclick=()=>{if(confirm('Жаңа сабақ ашылсын ба? Сақталмаған өзгерістер жоғалады.')){data=blank();setup();render();refreshLibrary();$('status').textContent='Жаңа сабақ'}};$('load').onclick=()=>{let x=lib().find(x=>x.id===$('library').value);if(x&&confirm('Сақталған сабақты ашу керек пе?')){data=x;setup();render();$('status').textContent='Сабақ ашылды.'}};$('csv').onclick=()=>{let safe=x=>'"'+String(x).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';let rows=[['Қатысушы','Ұпай','Асыл тас'],...data.people.map(p=>[p.name,score(p),p.awards.length])];let u=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(safe).join(';')).join('\n')],{type:'text/csv;charset=utf-8'}));let a=el('a');a.href=u;a.download='crystal-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};setup();render();refreshLibrary();</script></html>

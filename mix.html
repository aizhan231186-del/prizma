<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIZMA MIX</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#42265d,#100c20 75%);color:#fff;font:16px Arial;min-height:100vh}main{max-width:1050px;margin:auto;padding:24px}h1{text-align:center;color:#ffdb98;font-size:clamp(30px,6vw,65px)}a{color:#d6b9ff}section{background:#ffffff09;border:1px solid #ad83cc66;border-radius:22px;padding:20px;margin:18px 0}button,input,textarea,select{font:inherit;background:#2c214b;color:white;border:1px solid #a488d0;border-radius:12px;padding:12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}textarea,input{width:100%;margin:8px 0}textarea{min-height:100px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:15px;margin:24px 0}.door{height:170px;border-radius:65px 65px 10px 10px;border:2px solid #e7bd73;box-shadow:0 0 20px #d9a7ff66,inset 0 0 25px #a575e844;background:linear-gradient(100deg,#261344,#654184,#241340);font-size:34px;transition:transform .3s}.door:hover:not(:disabled){transform:translateY(-7px)}.door.open{animation:glow .65s ease}@keyframes glow{50%{transform:scale(1.08);box-shadow:0 0 65px #ffdb86}}#reveal{text-align:center;font-size:clamp(22px,4vw,38px);color:#ffda86;min-height:70px}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.group{padding:15px;border:1px solid var(--c);border-radius:15px;background:#ffffff09}.group h3{color:var(--c)}li{margin:7px 0;overflow-wrap:anywhere}[hidden]{display:none!important}@media print{body{background:white;color:black}#setup,#play,#actions,header,a{display:none!important}.group{border:1px solid #444}.group h3{color:black}section{border:0}}body{background:radial-gradient(ellipse at top,#4c2869,#111025 70%)}.machine{max-width:460px;margin:25px auto;perspective:800px}#drum{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;border:6px solid #d6b36b;background:radial-gradient(circle at 28% 18%,#ffffff55,transparent 33%),radial-gradient(circle at 60% 70%,#44316e,#17162d);box-shadow:inset -18px -25px 50px #0009,inset 12px 9px 24px #ffffff33,0 0 40px #e8b85c55;isolation:isolate}#drum:after{content:'';position:absolute;inset:5%;border-radius:50%;border-top:8px solid #ffffff55;pointer-events:none;transform:rotate(-24deg);z-index:4}.capsule{position:absolute;display:flex;align-items:center;justify-content:center;width:var(--w);height:30px;border-radius:30px;background:linear-gradient(155deg,#fff8 0%,var(--c) 45%,#171227 100%);box-shadow:inset 0 3px 5px #fff7,0 5px 12px #0009;color:#fff;font-size:11px;font-weight:bold;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px;transition:left .23s linear,top .23s linear,transform .23s linear}.base{background:linear-gradient(100deg,#583b19,#ffe2a0 35%,#96723a 65%,#4a321b);padding:22px;border-radius:20px 20px 35px 35px;box-shadow:0 12px 25px #0008;margin:-12px 8% 0;position:relative}.chute{background:#171127;border:2px solid #b18a48;border-radius:15px;padding:12px;min-height:66px!important;font-size:19px!important;overflow-wrap:anywhere}.group li{animation:pop .3s ease}@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.capsule,.group li{transition:none;animation:none}}</style><main><header><a href="index.html">← PRIZMA</a><p>◈ PRIZMA / 009</p></header><h1>✦ PRIZMA MIX ✦</h1><p style="text-align:center">Кездейсоқ таңдау — жаңа команда</p><section id="setup"><label>Білім алушылар (әр жолға бір есім немесе бүркеншік ат)<textarea id="names" placeholder="Аружан&#10;Дана&#10;Әли"></textarea></label><label>Топ саны <select id="count"></select></label><div id="labels"></div><div class="row"><button id="start">Лототронды іске қосу</button><button id="load">Сақталған нәтижені ашу</button></div><p id="status" aria-live="polite"></p><small>Тізім серверге жіберілмейді. Сақтау осы браузерде ғана жүргізіледі.</small></section><section id="play" hidden><p id="progress"></p><div class="machine"><div id="drum"></div><div class="base"><div class="chute" id="reveal" aria-live="polite">✦</div></div></div><button id="sound">🔊 Дыбыс</button><button id="skip">Анимацияны аяқтау</button></section><section id="results" hidden><h2>Топтар құрамы</h2><div id="groups" class="groups"></div><div class="row" id="actions" style="margin-top:18px"><button id="save">Нәтижені сақтау</button><button id="again">Қайта бөлу</button><button id="edit">Тізімді өзгерту</button><button id="print">Басып шығару</button></div><p id="notice"></p></section></main><script>
const $=id=>document.getElementById(id),key='prizma-mix-v1',colors=['#c5a4ff','#62ddee','#ffcf75','#ff92b0','#8be7af','#87a9ff','#f6a778','#dacbff'];let names=[],labels=[],groups=[],pool=[],remaining=[],sound=true,ctx,run=0,timer,drawTimer,balls=[];function el(t,txt,p){let e=document.createElement(t);if(txt!==null)e.textContent=txt;p.append(e);return e}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}for(let i=2;i<=8;i++)el('option',String(i),$('count')).value=i;$('count').value=3;function fields(){let prev=Array.from($('labels').querySelectorAll('input')).map(x=>x.value);$('labels').replaceChildren();for(let i=0;i<Number($('count').value);i++){let n=el('input',null,$('labels'));n.value=prev[i]||['Тұлпар','Қыран','Барыс','Сұңқар','Самғау','Жалын','Шабыт','Арман'][i];n.setAttribute('aria-label',(i+1)+'-топ атауы')}}fields();$('count').onchange=fields;function tone(){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();[440,660,880].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.12;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.3)})}catch{}}function stop(){clearInterval(timer);clearTimeout(drawTimer);run++}function start(){stop();let ticket=run;groups=labels.map(()=>[]);let order=shuffle(labels.map((_,i)=>i));pool=shuffle(names.map((_,i)=>order[i%labels.length]));remaining=shuffle(names.map((_,i)=>i));$('setup').hidden=true;$('play').hidden=false;$('results').hidden=false;$('notice').textContent='';$('reveal').textContent='Капсулалар араласуда…';$('skip').disabled=false;$('drum').replaceChildren();balls=names.map((n,i)=>{let b=el('div',n,$('drum'));b.className='capsule';b.title=n;b.style.setProperty('--w',names.length>40?'48px':'82px');b.style.setProperty('--c',colors[i%colors.length]);if(i>=60)b.hidden=true;return b});function move(){balls.forEach((b,i)=>{if(b.hidden)return;let a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*35;b.style.left=(50+Math.cos(a)*r)+'%';b.style.top=(50+Math.sin(a)*r)+'%';b.style.transform='translate(-50%,-50%) rotate('+((Math.random()-.5)*150)+'deg)'})}move();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)timer=setInterval(move,250);tone();render();function draw(){if(ticket!==run)return;if(!remaining.length){finish();return}let p=remaining.pop(),g=pool.pop();groups[g].push(names[p]);balls[p].hidden=true;let hidden=remaining.find(i=>balls[i].hidden);if(hidden!==undefined)balls[hidden].hidden=false;$('reveal').textContent=names[p]+' → '+labels[g];tone();render();drawTimer=setTimeout(draw,Math.max(110,Math.min(750,14000/names.length)))}drawTimer=setTimeout(draw,2600)}function finish(){stop();$('drum').replaceChildren();$('skip').disabled=true;$('reveal').textContent='✦ Барлығы топқа бөлінді!';render()}function render(){$('progress').textContent=(names.length-remaining.length)+' / '+names.length+' адам бөлінді';$('groups').replaceChildren();groups.forEach((g,i)=>{let card=el('div',null,$('groups'));card.className='group';card.style.setProperty('--c',colors[i]);el('h3',labels[i]+' · '+g.length,card);let ul=el('ol',null,card);g.forEach(n=>el('li',n,ul))});$('save').disabled=remaining.length>0;$('print').disabled=remaining.length>0} $('skip').onclick=()=>{while(remaining.length){let p=remaining.pop();groups[pool.pop()].push(names[p])}finish()};$('start').onclick=()=>{let n=$('names').value.split(/\n/).map(x=>x.trim()).filter(Boolean),l=Array.from($('labels').querySelectorAll('input')).map(x=>x.value.trim());if(n.length<l.length||n.length>200||l.some(x=>!x)||new Set(l).size!==l.length){$('status').textContent='2–200 есім енгізіңіз. Адам саны топ санынан кем болмауы және топ атаулары бірегей болуы керек.';return}names=n;labels=l;start()};$('again').onclick=start;$('edit').onclick=()=>{stop();$('setup').hidden=false;$('play').hidden=true;$('results').hidden=true};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Дыбыс':'🔇 Дыбыс'};$('print').onclick=()=>window.print();$('save').onclick=()=>{if(remaining.length)return;try{localStorage.setItem(key,JSON.stringify({names,labels,groups}));$('notice').textContent='Нәтиже сақталды.'}catch{$('notice').textContent='Сақтау мүмкін болмады.'}};$('load').onclick=()=>{stop();try{let d=JSON.parse(localStorage.getItem(key));if(!d||!Array.isArray(d.names)||!Array.isArray(d.labels)||!Array.isArray(d.groups)||d.groups.length!==d.labels.length)throw Error();({names,labels,groups}=d);remaining=[];pool=[];$('names').value=names.join('\n');$('count').value=labels.length;fields();Array.from($('labels').querySelectorAll('input')).forEach((x,i)=>x.value=labels[i]);$('setup').hidden=true;$('play').hidden=true;$('results').hidden=false;render();$('notice').textContent='Сақталған нәтиже ашылды.'}catch{$('status').textContent='Сақталған нәтиже табылмады.'}};</script></html>

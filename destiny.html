<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIZMA DESTINY</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#42265d,#100c20 75%);color:#fff;font:16px Arial;min-height:100vh}main{max-width:1050px;margin:auto;padding:24px}h1{text-align:center;color:#ffdb98;font-size:clamp(30px,6vw,65px)}a{color:#d6b9ff}section{background:#ffffff09;border:1px solid #ad83cc66;border-radius:22px;padding:20px;margin:18px 0}button,input,textarea,select{font:inherit;background:#2c214b;color:white;border:1px solid #a488d0;border-radius:12px;padding:12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}textarea,input{width:100%;margin:8px 0}textarea{min-height:100px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:15px;margin:24px 0}.door{height:170px;border-radius:65px 65px 10px 10px;border:2px solid #e7bd73;box-shadow:0 0 20px #d9a7ff66,inset 0 0 25px #a575e844;background:linear-gradient(100deg,#261344,#654184,#241340);font-size:34px;transition:transform .3s}.door:hover:not(:disabled){transform:translateY(-7px)}.door.open{animation:glow .65s ease}@keyframes glow{50%{transform:scale(1.08);box-shadow:0 0 65px #ffdb86}}#reveal{text-align:center;font-size:clamp(22px,4vw,38px);color:#ffda86;min-height:70px}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.group{padding:15px;border:1px solid var(--c);border-radius:15px;background:#ffffff09}.group h3{color:var(--c)}li{margin:7px 0;overflow-wrap:anywhere}[hidden]{display:none!important}@media print{body{background:white;color:black}#setup,#play,#actions,header,a{display:none!important}.group{border:1px solid #444}.group h3{color:black}section{border:0}}</style><main><header><a href="index.html">← PRIZMA</a><p>◈ PRIZMA / 007</p></header><h1>✦ PRIZMA DESTINY ✦</h1><p style="text-align:center">Таңдау құпиясы · Әр есік — жаңа мүмкіндік</p><section id="setup"><label>Білім алушылар (әр жолға бір есім немесе бүркеншік ат)<textarea id="names" placeholder="Аружан&#10;Дана&#10;Әли"></textarea></label><label>Топ саны <select id="count"></select></label><div id="labels"></div><div class="row"><button id="start">Құпия есіктерді ашу</button><button id="load">Сақталған нәтижені ашу</button></div><p id="status" aria-live="polite"></p><small>Тізім серверге жіберілмейді. Сақтау осы браузерде ғана жүргізіледі.</small></section><section id="play" hidden><label>Өз есіміңізді таңдаңыз <select id="person"></select></label><p id="progress"></p><div id="doors" class="doors"></div><div id="reveal" aria-live="polite">Құпия есікті таңдаңыз!</div><button id="sound">🔊 Дыбыс</button></section><section id="results" hidden><h2>Топтар құрамы</h2><div id="groups" class="groups"></div><div class="row" id="actions" style="margin-top:18px"><button id="save">Нәтижені сақтау</button><button id="again">Қайта бөлу</button><button id="edit">Тізімді өзгерту</button><button id="print">Басып шығару</button></div><p id="notice"></p></section></main><script>
const $=id=>document.getElementById(id),key='prizma-destiny-v1',colors=['#c5a4ff','#62ddee','#ffcf75','#ff92b0','#8be7af','#87a9ff','#f6a778','#dacbff'];let names=[],labels=[],groups=[],pool=[],remaining=[],sound=true,ctx;function el(t,txt,p){let e=document.createElement(t);if(txt!==null)e.textContent=txt;p.append(e);return e}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}for(let i=2;i<=8;i++)el('option',String(i),$('count')).value=i;$('count').value=3;function fields(){let prev=Array.from($('labels').querySelectorAll('input')).map(x=>x.value);$('labels').replaceChildren();for(let i=0;i<Number($('count').value);i++){let n=el('input',null,$('labels'));n.value=prev[i]||['Тұлпар','Қыран','Барыс','Сұңқар','Самғау','Жалын','Шабыт','Арман'][i];n.setAttribute('aria-label',(i+1)+'-топ атауы')}}fields();$('count').onchange=fields;function tone(){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();[440,660,880].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.12;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.3)})}catch{}}function start(){groups=labels.map(()=>[]);let order=shuffle(labels.map((_,i)=>i));pool=shuffle(names.map((_,i)=>order[i%labels.length]));remaining=names.map((_,i)=>i);$('setup').hidden=true;$('play').hidden=false;$('results').hidden=false;$('notice').textContent='';$('reveal').textContent='Құпия есікті таңдаңыз!';render()}function render(){let selected=$('person').value;$('person').replaceChildren();remaining.forEach(i=>el('option',names[i],$('person')).value=i);if(remaining.includes(Number(selected))&&selected!=='')$('person').value=selected;$('progress').textContent=(names.length-remaining.length)+' / '+names.length+' адам бөлінді';$('doors').replaceChildren();for(let i=0;i<Math.min(6,pool.length);i++){let b=el('button','✧ '+(i+1),$('doors'));b.className='door';b.onclick=()=>choose(i,b)}$('groups').replaceChildren();groups.forEach((g,i)=>{let card=el('div',null,$('groups'));card.className='group';card.style.setProperty('--c',colors[i]);el('h3',labels[i]+' · '+g.length,card);let ul=el('ol',null,card);g.forEach(n=>el('li',n,ul))});$('save').disabled=remaining.length>0;$('print').disabled=remaining.length>0;if(!remaining.length){$('progress').textContent='Барлығы топқа бөлінді!';$('person').disabled=true}else $('person').disabled=false}function choose(i,b){if(!remaining.length||!pool.length)return;let p=Number($('person').value),k=remaining.indexOf(p);if(k<0)return;let g=pool.splice(i,1)[0];remaining.splice(k,1);groups[g].push(names[p]);$('reveal').textContent=names[p]+' → '+labels[g];tone();b.classList.add('open');render();$('reveal').animate?.([{opacity:.2,transform:'scale(.95)'},{opacity:1,transform:'scale(1)'}],{duration:450})}$('start').onclick=()=>{let n=$('names').value.split(/\n/).map(x=>x.trim()).filter(Boolean),l=Array.from($('labels').querySelectorAll('input')).map(x=>x.value.trim());if(n.length<l.length||n.length>200||l.some(x=>!x)||new Set(l).size!==l.length){$('status').textContent='2–200 есім енгізіңіз. Адам саны топ санынан кем болмауы және топ атаулары бірегей болуы керек.';return}names=n;labels=l;start()};$('again').onclick=start;$('edit').onclick=()=>{$('setup').hidden=false;$('play').hidden=true;$('results').hidden=true};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Дыбыс':'🔇 Дыбыс'};$('print').onclick=()=>window.print();$('save').onclick=()=>{if(remaining.length)return;try{localStorage.setItem(key,JSON.stringify({names,labels,groups}));$('notice').textContent='Нәтиже сақталды.'}catch{$('notice').textContent='Сақтау мүмкін болмады.'}};$('load').onclick=()=>{try{let d=JSON.parse(localStorage.getItem(key));if(!d||!Array.isArray(d.names)||!Array.isArray(d.labels)||!Array.isArray(d.groups)||d.groups.length!==d.labels.length)throw Error();({names,labels,groups}=d);remaining=[];pool=[];$('names').value=names.join('\n');$('count').value=labels.length;fields();Array.from($('labels').querySelectorAll('input')).forEach((x,i)=>x.value=labels[i]);$('setup').hidden=true;$('play').hidden=true;$('results').hidden=false;render();$('notice').textContent='Сақталған нәтиже ашылды.'}catch{$('status').textContent='Сақталған нәтиже табылмады.'}};</script></html>

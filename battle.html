<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIZMA BATTLE</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#253966,#101329 75%);color:#fff;font:16px Arial;min-height:100vh}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:clamp(32px,6vw,65px);color:#b6baff}button,input,select,textarea{font:inherit;border:1px solid #60739c;border-radius:10px;padding:11px;color:white;background:#26385a}button{cursor:pointer;background:#4658a4}button:disabled{opacity:.35;cursor:default}input,textarea{width:100%;margin:5px 0}section,fieldset,dialog{background:#192945;border:1px solid #475b87;border-radius:18px;padding:18px;margin:15px 0;color:white}dialog{max-width:600px;width:90%;margin:auto}dialog::backdrop{background:#080c20cc}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.team{padding:16px;border:1px solid #71b6fa;border-radius:12px}.active{box-shadow:0 0 15px #72b8ff}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.tile{padding:20px 3px;font-size:clamp(15px,3vw,27px);background:linear-gradient(145deg,#233b74,#593b91);color:#ffda80}.cat{text-align:center;overflow-wrap:anywhere;font-size:14px;padding:8px 0}small{color:#b9c5de}a{color:#b6baff} [hidden]{display:none!important}</style><main><a href="index.html">← PRIZMA</a><p>◈ PRIZMA / 004</p><h1>⚡ PRIZMA BATTLE</h1><p>Білім. Бәсеке. Бірлік.</p><div class="row" id="nav"><button id="edit">Мұғалім режимі</button><button id="play">Ойын режимі</button></div><section id="editor" hidden><label>Пән<input id="subject"></label><label>Тақырып<input id="topic"></label><label>Әр сұраққа уақыт (секунд, 0 — шектеусіз)<input id="seconds" type="number" min="0" max="600"></label><label>Командалар (2, үтірмен бөліңіз)<input id="names"></label><div id="fields"></div><div class="row"><button id="save">Сақтау</button><button id="fresh">Жаңа ойын</button><select id="library"></select><button id="load">Ашу</button><button id="share">Сілтемені көшіру</button></div><p id="status"></p><small>Ойындар осы браузерде сақталады. Сілтеме ойынның тапсырмаларын қамтиды. Жеке деректер енгізбеңіз.</small></section><section id="game"><h2 id="heading"></h2><div id="teams" class="teams"></div><p>Жауап беретін команданы таңдаңыз.</p><div id="board" class="board"></div><p id="result"></p><button id="reset">Қайта бастау</button></section><dialog id="modal"><h2 id="question"></h2><p id="clock"></p><button id="reveal">Жауапты көрсету</button><p id="answer" hidden></p><div class="row"><button id="correct">Дұрыс жауап</button><button id="wrong">Қате / жауап жоқ</button><button id="close">Жабу</button></div></dialog></main><script>
const $=id=>document.getElementById(id), key='prizma-battle-v2';const sample={subject:'Қазақ әдебиеті',topic:'Абай шығармашылығы',seconds:30,names:['Тұлпар','Қыран'],cats:['Өмірбаян','Өлеңдер','Қара сөздер','Таным','Мұра'],q:[['Абай қай жылы туған?','1845'],['Туған есімі?','Ибраһим'],['Әкесі кім?','Құнанбай'],['Анасы кім?','Ұлжан'],['Әжесі кім?','Зере'],['Жыл мезгілі туралы бір өлеңін атаңыз.','Қыс / Жаз / Күз / Жазғытұры'],['Ғылым туралы өлеңін атаңыз.','Ғылым таппай мақтанба'],['Абайдың әнін атаңыз.','Көзімнің қарасы (немесе басқа дұрыс ән)'],['Қыс өлеңінде қандай көркемдік тәсіл бар?','Кейіптеу'],['Бір өлеңінің идеясын түсіндіріңіз.','Мұғалім мазмұнына қарай бағалайды'],['Қара сөздер саны?','45'],['Жетінші сөзде қандай құмарлықтар айтылады?','Тән және жан құмары'],['Он жетінші сөздегі үш ұғым?','Ақыл, қайрат, жүрек'],['Отыз бірінші сөздің тақырыбы?','Естігенді есте сақтау'],['Қара сөздердің тәрбиелік мәнін түсіндіріңіз.','Мұғалім бағалайды'],['Бес асыл істің бірін атаңыз.','Талап, еңбек, терең ой, қанағат, рақым'],['Бес дұшпанның бірін атаңыз.','Өсек, өтірік, мақтаншақ, еріншек, бекер мал шашпақ'],['Толық адам ұғымын түсіндіріңіз.','Мұғалім бағалайды'],['Абай аударған орыс ақындарының бірін атаңыз.','Пушкин / Лермонтов / Крылов'],['Абай үшін еңбектің маңызы қандай?','Мұғалім бағалайды'],['Абайдың туған өңірі?','Шыңғыстау өңірі'],['Абай жолы авторы кім?','Мұхтар Әуезов'],['Абай қай жылы қайтыс болды?','1904'],['Абай мұрасының бір ерекшелігі?','Мұғалім бағалайды'],['Абай идеялары бүгін неге маңызды?','Мұғалім бағалайды']]};sample.q=sample.q.filter((_,i)=>i%5<3).concat([["Абайдың әкесі кім?","Құнанбай"],["Абайдың әжесі кім?","Зере"],["Абайдың анасы кім?","Ұлжан"],["Абайдың табиғат туралы көктемгі өлеңі?","Жазғытұры"],["Абайдың махаббат тақырыбындағы әнін атаңыз.","Айттым сәлем, Қаламқас"],["Күз өлеңінің негізгі көрінісін сипаттаңыз.","Күзгі ауыл табиғаты мен тұрмысы"],["Абайдың прозалық мұрасы қалай аталады?","Қара сөздер"],["Он жетінші сөзде төрелік айтатын кім?","Ғылым"],["Отыз бірінші сөзде есте сақтаудың қандай шарттары бар?","Зейін, ынта, қайталау, ой кеселдерінен сақтану"],["Бес асыл істен екі мысал келтіріңіз.","Талап, еңбек, терең ой, қанағат, рақым"],["Бес дұшпаннан екі мысал келтіріңіз.","Өсек, өтірік, мақтаншақ, еріншек, бекер мал шашпақ"],["Абайдың білім туралы көзқарасын түсіндіріңіз.","Мұғалім бағалайды"],["Абайдың туған жылы?","1845"],["Абайдың қайтыс болған жылы?","1904"],["Абай мұрасының тәрбиелік маңызын түсіндіріңіз.","Мұғалім бағалайды"]]);sample.q[15]=['Абайдың әкесінің аты?','Құнанбай'];sample.q[2]=['Абайдың туған өңірін атаңыз.','Шыңғыстау'];sample.q[27]=['Абайдың шын есімін қойған кім?','Мұғалім дерекке сай бағалайды'];let data=structuredClone(sample),shared=false;function valid(d){return d&&typeof d.subject==='string'&&typeof d.topic==='string'&&Number.isInteger(d.seconds)&&d.seconds>=0&&d.seconds<=600&&Array.isArray(d.names)&&d.names.length===2&&d.names.every(x=>typeof x==='string')&&Array.isArray(d.cats)&&d.cats.length===5&&d.cats.every(x=>typeof x==='string')&&Array.isArray(d.q)&&d.q.length===30&&d.q.every(x=>Array.isArray(x)&&x.length===2&&x.every(y=>typeof y==='string'))}try{if(location.hash){let d=JSON.parse(decodeURIComponent(location.hash.slice(1)));if(valid(d)){data=d;shared=true}}}catch(e){}let scores=[],used=new Set(),active=0,current=-1,timer,expires=0,selectedId=null;function el(tag,txt,parent){let e=document.createElement(tag);if(txt!==null)e.textContent=txt;parent.append(e);return e}function button(txt,parent,fn){let b=el('button',txt,parent);b.onclick=fn;return b}function fill(){for(let k of ['subject','topic','seconds'])$(k).value=data[k];$('names').value=data.names.join(', ');$('fields').replaceChildren();data.cats.forEach((c,i)=>{let f=el('fieldset',null,$('fields'));el('legend','Санат '+(i+1),f);let n=el('input',null,f);n.id='cat'+i;n.value=c;for(let t=0;t<2;t++)for(let j=0;j<3;j++){let k=t*15+i*3+j;el('p',(t+1)+'-топ · '+(j+1)*10+' ұпай',f);let q=el('textarea',null,f);q.id='q'+k;q.value=data.q[k][0];let a=el('textarea',null,f);a.id='a'+k;a.value=data.q[k][1];}});refreshLibrary()}function collect(){let d={subject:$('subject').value.trim(),topic:$('topic').value.trim(),seconds:Number($('seconds').value),names:$('names').value.split(',').map(s=>s.trim()).filter(Boolean),cats:Array.from({length:5},(_,i)=>$('cat'+i).value.trim()),q:Array.from({length:30},(_,i)=>[$('q'+i).value.trim(),$('a'+i).value.trim()])};if(!valid(d)||!d.subject||!d.topic||d.cats.some(x=>!x)||d.q.some(x=>x.some(y=>!y))){$('status').textContent='Барлық деректерді дұрыс толтырыңыз.';return false}data=d;return true}function library(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return {}}}function refreshLibrary(){let s=$('library');s.replaceChildren();let o=el('option','Сақталған ойынды таңдаңыз',s);o.value='';for(let [id,d] of Object.entries(library())){let o=el('option',d.subject+' · '+d.topic,s);o.value=id}if(selectedId)s.value=selectedId}function reset(){clearInterval(timer);scores=data.names.map(()=>0);used.clear();active=0;render()}function render(){$('heading').textContent=data.subject+' · '+data.topic;$('teams').replaceChildren();data.names.forEach((n,i)=>{let b=button(n+' · '+scores[i]+' ұпай',$('teams'),()=>{active=i;render()});b.className='team'+(i===active?' active':'')});let board=$('board');$('board').setAttribute('aria-label',data.names[active]+' сұрақтары');board.replaceChildren();data.cats.forEach(c=>el('div',c,board).className='cat');for(let j=0;j<3;j++)for(let i=0;i<5;i++){let k=active*15+i*3+j,b=button(used.has(k)?'✓':String((j+1)*10),board,()=>openQ(k));b.className='tile';b.disabled=used.has(k)}let max=Math.max(...scores);$('result').textContent=used.size===30?'Жеңімпаз: '+data.names.filter((_,i)=>scores[i]===max).join(', ')+' · '+max+' ұпай':'Орындалған тапсырма: '+used.size+'/30'}function openQ(k){current=k;$('question').textContent=data.q[k][0];$('answer').textContent=data.q[k][1];$('answer').hidden=true;$('correct').disabled=false;$('clock').textContent=data.seconds?'Уақыт: '+data.seconds:'Уақыт шектеусіз';$('modal').showModal();clearInterval(timer);if(data.seconds){expires=Date.now()+data.seconds*1000;timer=setInterval(()=>{let n=Math.max(0,Math.ceil((expires-Date.now())/1000));$('clock').textContent=n?'Уақыт: '+n:'Уақыт аяқталды';if(!n){clearInterval(timer);$('correct').disabled=true}},200)}}function finish(ok){if(current<0||used.has(current))return;if(ok&&data.seconds&&Date.now()>=expires)return;used.add(current);if(ok)scores[active]+=(current%3+1)*10;closeQ();render()}function closeQ(){clearInterval(timer);current=-1;$('modal').close()}$('modal').addEventListener('close',()=>{clearInterval(timer);current=-1});$('reveal').onclick=()=>$('answer').hidden=false;$('correct').onclick=()=>finish(true);$('wrong').onclick=()=>finish(false);$('close').onclick=closeQ;$('reset').onclick=reset;$('edit').onclick=()=>{fill();$('editor').hidden=false;$('game').hidden=true};$('play').onclick=()=>{if(!$('editor').hidden&&!collect())return;$('editor').hidden=true;$('game').hidden=false;reset()};$('save').onclick=()=>{if(!collect())return;try{let l=library();selectedId=selectedId||String(Date.now());l[selectedId]=data;localStorage.setItem(key,JSON.stringify(l));refreshLibrary();$('status').textContent='Ойын сақталды.'}catch(e){$('status').textContent='Сақтау мүмкін болмады.'}};$('fresh').onclick=()=>{selectedId=null;data=structuredClone(sample);fill();$('status').textContent='Жаңа ойын үлгісі.'};$('load').onclick=()=>{let id=$('library').value,d=library()[id];if(valid(d)){selectedId=id;data=d;fill();$('status').textContent='Ойын ашылды.'}};$('share').onclick=async()=>{if(!collect())return;let u=new URL(location.href);u.search='';u.hash=encodeURIComponent(JSON.stringify(data));try{await navigator.clipboard.writeText(u.href);$('status').textContent='Сілтеме көшірілді.'}catch(e){prompt('Сілтемені көшіріңіз:',u.href)}};if(shared){$('editor').remove();$('nav').remove()}reset();</script></html>

<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIZMA GAME 002 — SECRET CODE</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#182c49,#080d1b 70%);color:#edf2ff;font:16px system-ui;min-height:100vh}main{max-width:1000px;margin:auto;padding:25px}a{color:#e5ba69}header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}button,input,select{font:inherit;border:1px solid #58627c;border-radius:10px;padding:12px;color:inherit;background:#17243c}button{cursor:pointer;background:#273554}button:hover{border-color:#e9bd68}button:disabled{opacity:.5;cursor:default}h1{font-size:clamp(36px,8vw,78px);letter-spacing:.1em;margin:22px 0 0;color:#f7cd80;text-align:center}p{text-align:center;color:#b9c7dc}.panel{border:1px solid #34445e;background:#101b2dcc;border-radius:22px;padding:22px;margin-top:20px}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.vault{width:210px;height:210px;border:12px solid #58667a;border-radius:50%;margin:25px auto;background:repeating-radial-gradient(circle,#26354a 0 16px,#19263a 17px 19px);display:grid;place-items:center;box-shadow:0 0 40px #d1a45133,inset 0 0 25px #000;transition:transform 1s}.vault.open{transform:rotate(-30deg) scale(.88);box-shadow:0 0 65px #e9bd68}.lock{font-size:70px}.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.key{text-align:center;padding:14px 0;border:1px solid #a78649;border-radius:8px;color:#f7cd80;font-size:24px;background:#201e24}.missions{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;margin:20px 0}.missions button{min-height:65px}.gold{background:#d9ad60;color:#151b28;font-weight:bold}.actions{display:flex;gap:10px;flex-wrap:wrap}label{display:block;margin:10px 0 5px}input,select{width:100%}fieldset{border:1px solid #34445e;border-radius:12px;margin:15px 0;padding:15px}dialog{width:min(92vw,540px);background:#152239;color:white;border:1px solid #cda358;border-radius:18px;padding:24px}dialog::backdrop{background:#000b}.answers{display:grid;gap:10px}.answers button{text-align:left}.good{background:#205b43}.bad{background:#743b45}[hidden]{display:none!important}#status,#feedback{min-height:24px;color:#f7cd80;overflow-wrap:anywhere}#result{text-align:center;font-size:20px;color:#f7cd80}</style><main><header><a href="index.html">← PRIZMA басты беті</a><div class="actions"><button id="teacherBtn">Мұғалім режимі</button><button id="sound">Дыбыс: қосулы</button></div></header><p>PRIZMA GAME / 002</p><h1>SECRET CODE</h1><p>Жеті кілт. Бір құпия. Бір жеңіс.</p><section id="game" class="panel"><h2 id="heading"></h2><div class="stats"><span id="score"></span><span id="clock"></span></div><div class="vault" id="vault"><span class="lock" id="lock">🔒</span></div><div class="keys" id="keys"></div><p>Тапсырмаларды орындап, құпия кодты жинаңыз.</p><div class="missions" id="missions"></div><div id="result"></div><div class="actions"><button id="unlock" class="gold" disabled>Сейфті ашу</button><button id="restart">Қайта бастау</button></div></section><section class="panel" id="editor" hidden><h2>Ойын құрастыру</h2><label>Пән</label><input id="subject"><label>Тақырып</label><input id="topic"><label>Уақыт (минут, 0 — шектеусіз)</label><input type="number" min="0" max="180" id="minutes"><div id="fields"></div><div class="actions"><button class="gold" id="save">Сақтау</button><button id="play">Ойынды бастау</button><button id="share">Сілтемені көшіру</button><button id="fresh">Жаңа ойын</button></div><label>Менің ойындарым</label><select id="saved"></select><div class="actions" style="margin-top:10px"><button id="load">Өңдеу</button><button id="remove">Жою</button></div><label>Ойын сілтемесі</label><input id="link" readonly><div id="status" role="status"></div><p>Ойындар осы браузерде сақталады. Сілтеме сұрақтар мен жауаптарды қамтиды; жеке деректер енгізбеңіз.</p></section></main><dialog id="modal"><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" role="status"></p><button id="close">Жабу</button></dialog><script>
const $=id=>document.getElementById(id), clone=x=>JSON.parse(JSON.stringify(x));const sample={subject:'Қазақ әдебиеті',topic:'Абай шығармашылығы',minutes:5,q:[['Абай қай жылы дүниеге келді?','1835','1845','1850','1900',1],['Абайдың шын есімі?','Ибраһим','Шоқан','Ахмет','Ыбырай',0],['Абайдың әкесі кім?','Шәкәрім','Оспан','Құнанбай','Тәкежан',2],['Абайдың әжесі кім?','Ұлжан','Зере','Айгерім','Ділдә',1],['Абайдың қара сөздерінің саны?','25','30','40','45',3],['Абайдың өлеңін табыңыз.','Ғылым таппай мақтанба','Мен жастарға сенемін','Сарыарқа','Үш бақытым',0],['Абай туған өңір?','Тараз','Маңғыстау','Шыңғыстау','Көкшетау',2]]};let data=clone(sample),shared=false,activeId=null,done=new Set(),digits=[],timer,deadline=0,expired=false,opened=false,sound=true;const store='prizma-secret-code-v1';function valid(d){return d&&typeof d.subject==='string'&&typeof d.topic==='string'&&Number.isInteger(d.minutes)&&d.minutes>=0&&d.minutes<=180&&Array.isArray(d.q)&&d.q.length===7&&d.q.every(x=>Array.isArray(x)&&x.length===6&&x.slice(0,5).every(y=>typeof y==='string'&&y.trim())&&Number.isInteger(x[5])&&x[5]>=0&&x[5]<4)}try{const raw=new URLSearchParams(location.search).get('game')|| (location.hash?decodeURIComponent(location.hash.slice(1)):null);if(raw){const d=JSON.parse(raw);if(!valid(d))throw Error();data=d;shared=true}}catch(e){alert('Сілтеме жарамсыз. Үлгі ойын ашылады.')}function library(){try{return JSON.parse(localStorage.getItem(store)||'[]')}catch{return []}}function write(a){localStorage.setItem(store,JSON.stringify(a))}function beep(ok=true){if(!sound)return;try{const ac=new (window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=ok?660:180;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.start();o.stop(ac.currentTime+.3);o.onended=()=>ac.close()}catch{}}function render(){ $('heading').textContent=data.subject+' · '+data.topic;$('score').textContent=`Ұпай: ${done.size*10}/70 · Кілт: ${done.size}/7`;$('keys').replaceChildren();$('missions').replaceChildren();digits.forEach((d,i)=>{let k=document.createElement('div');k.className='key';k.textContent=done.has(i)?d:'?';$('keys').append(k);let b=document.createElement('button');b.textContent=done.has(i)?`✓ ${i+1}`:`Кілт ${i+1}`;b.disabled=done.has(i)||expired||opened;b.onclick=()=>ask(i);$('missions').append(b)});$('unlock').disabled=done.size!==7||expired||opened}function tick(){if(!deadline){$('clock').textContent='Уақыт шектеусіз';return}let s=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('clock').textContent=`Уақыт: ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(!s&&!opened){expired=true;clearInterval(timer);if($('modal').open)$('modal').close();$('result').textContent='Уақыт аяқталды!';render()}}function start(){clearInterval(timer);done.clear();digits=Array.from({length:7},()=>Math.floor(Math.random()*10));expired=false;opened=false;$('vault').classList.remove('open');$('lock').textContent='🔒';$('result').textContent='';$('editor').hidden=true;$('game').hidden=false;deadline=data.minutes?Date.now()+data.minutes*60000:0;render();tick();if(deadline)timer=setInterval(tick,250)}function ask(i){tick();if(expired)return;const q=data.q[i];$('question').textContent=q[0];$('feedback').textContent='';$('answers').replaceChildren();q.slice(1,5).forEach((a,j)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>{tick();if(expired||done.has(i))return;if(j===q[5]){done.add(i);b.classList.add('good');$('feedback').textContent='Дұрыс! Кілт ашылды: '+digits[i];[...$('answers').children].forEach(e=>e.disabled=true);beep();render()}else{b.classList.add('bad');b.disabled=true;$('feedback').textContent='Қате. Қайта байқап көріңіз.';beep(false)}};$('answers').append(b)});$('modal').showModal()}function list(){let s=$('saved');s.replaceChildren(new Option('Сақталған ойынды таңдаңыз',''));library().forEach(x=>s.add(new Option(x.data.subject+' · '+x.data.topic,x.id)));s.value=activeId||''}function edit(){clearInterval(timer);$('game').hidden=true;$('editor').hidden=false;$('subject').value=data.subject;$('topic').value=data.topic;$('minutes').value=data.minutes;$('fields').replaceChildren();data.q.forEach((q,i)=>{let f=document.createElement('fieldset'),l=document.createElement('legend');l.textContent='Кілт '+(i+1);f.append(l);q.slice(0,5).forEach((v,j)=>{let lab=document.createElement('label'),inp=document.createElement('input');lab.textContent=j?'Жауап '+j:'Сұрақ';inp.id=`q${i}-${j}`;inp.value=v;f.append(lab,inp)});let lab=document.createElement('label'),s=document.createElement('select');lab.textContent='Дұрыс жауап';s.id='c'+i;for(let j=0;j<4;j++)s.add(new Option('Жауап '+(j+1),j));s.value=q[5];f.append(lab,s);$('fields').append(f)});$('status').textContent='';$('link').value='';list()}function collect(){let d={subject:$('subject').value.trim(),topic:$('topic').value.trim(),minutes:Number($('minutes').value),q:Array.from({length:7},(_,i)=>[...Array.from({length:5},(_,j)=>$(`q${i}-${j}`).value.trim()),Number($('c'+i).value)])};if(!valid(d)||!d.subject||!d.topic){$('status').textContent='Барлық өрістерді дұрыс толтырыңыз.';return false}data=d;return true}function save(){if(!collect())return false;try{let a=library();if(!activeId)activeId=Date.now().toString(36)+Math.random().toString(36).slice(2);a=a.filter(x=>x.id!==activeId);a.push({id:activeId,data:clone(data)});write(a);list();$('status').textContent='Ойын сақталды!';return true}catch{$('status').textContent='Браузерде сақтау мүмкін болмады.';return false}}$('save').onclick=save;$('play').onclick=()=>{if(collect())start()};$('share').onclick=async()=>{if(!collect())return;let u=new URL(location.href);u.hash='';u.search='';u.searchParams.set('game',JSON.stringify(data));$('link').value=u.href;try{await navigator.clipboard.writeText(u.href);$('status').textContent='Сілтеме көшірілді!'}catch{$('link').select();$('status').textContent='Сілтемені қолмен көшіріңіз.'}};$('fresh').onclick=()=>{activeId=null;data={subject:'',topic:'',minutes:0,q:Array.from({length:7},()=>['','','','','',0])};edit()};$('load').onclick=()=>{let x=library().find(x=>x.id===$('saved').value);if(x){activeId=x.id;data=clone(x.data);edit()}};$('remove').onclick=()=>{let id=$('saved').value;if(id&&confirm('Ойынды жою керек пе?')){try{write(library().filter(x=>x.id!==id));if(activeId===id)activeId=null;list()}catch{$('status').textContent='Жою мүмкін болмады.'}}};$('teacherBtn').onclick=edit;$('restart').onclick=start;$('close').onclick=()=>$('modal').close();$('sound').onclick=()=>{sound=!sound;$('sound').textContent='Дыбыс: '+(sound?'қосулы':'өшірулі')};$('unlock').onclick=()=>{tick();if(done.size!==7||expired||opened)return;opened=true;clearInterval(timer);$('vault').classList.add('open');$('lock').textContent='🔓';$('result').textContent='Миссия орындалды! Құпия код: '+digits.join('')+' · 70/70';beep();render()};if(shared)$('teacherBtn').hidden=true;start();
</script></html>

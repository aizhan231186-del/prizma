<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIZMA GAME — Жеті портал 2.0</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1e3268,#090b23 75%);color:#fff;font:16px Arial,sans-serif;min-height:100vh}main{max-width:1150px;margin:auto;padding:28px}h1{font-size:clamp(28px,5vw,48px)}button,input,textarea,select{font:inherit;border-radius:12px;padding:12px;border:1px solid #64749b}button{background:#7551dc;color:white;cursor:pointer}button:disabled{opacity:.6;cursor:default}input,textarea,select{background:#101a36;color:white;width:100%;margin:5px 0 12px}label{display:block}section,fieldset,dialog{background:#171f42;border:1px solid #64749b;border-radius:20px;padding:20px;color:white;margin:15px 0}dialog{max-width:min(520px,92vw);width:100%;margin:auto}dialog::backdrop{background:#000a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:22px;margin:32px 0}.portal{height:190px;border-radius:80px 80px 12px 12px;border:2px solid var(--c);background:radial-gradient(ellipse,var(--c),#102546 75%);box-shadow:0 0 22px var(--c);font-size:30px;color:white}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}a{color:#a8caff}p{line-height:1.5}.answer{display:block;width:100%;margin:8px 0;text-align:left}small{color:#c7cce5}[hidden]{display:none!important}</style><main><a href="index.html">← PRIZMA басты беті</a><h1>PRIZMA GAME · Жеті портал 2.0</h1><p>Жеті тапсырма. Жеті мүмкіндік. Бір мақсат.</p><div class="row"><button id="teacher">Ойын құрастыру</button><button id="play">Ойын режимі</button></div><section id="editor" hidden><h2>Мұғалім режимі</h2><label>Пән<input id="subject"></label><label>Тақырып<input id="topic"></label><label>Ойын уақыты (минут, 0 — шектеусіз)<input id="minutes" type="number" min="0" max="180"></label><div id="fields"></div><div class="row"><button id="save">Ойынды бастау</button><button id="share">Сілтемені көшіру</button></div><p id="status" role="status"></p><textarea id="link" readonly hidden></textarea><small>Сілтемеде сұрақтар мен жауаптар кодталып сақталады, бірақ құпияланбайды. Жеке деректер енгізбеңіз.</small></section><section id="game"><h2 id="heading"></h2><p id="score" role="status"></p><p id="clock"></p><div class="grid" id="portals"></div><p id="result" role="status"></p><button id="restart">Қайта бастау</button></section></main><dialog id="modal"><h2 id="question"></h2><div id="answers"></div><p id="feedback" role="status"></p><button id="close">Жабу</button></dialog><script>
const $=id=>document.getElementById(id);const sample=[['Қазақ әліпбиіндегі дауысты дыбысты таңдаңыз.','А','Б','Т','Қ',0],['Абайдың шын есімі?','Ибраһим','Шоқан','Ыбырай','Ахмет',0],['Зат есімді табыңыз.','Жүгірді','Кітап','Әдемі','Бес',1],['Қазақстанның астанасы?','Тараз','Алматы','Астана','Ақтау',2],['5 × 4 нешеге тең?','9','15','25','20',3],['Синоним жұбын табыңыз.','Биік – аласа','Әдемі – сұлу','Күн – түн','Ақ – қара',1],['Сұраулы сөйлемнің белгісі?','!','.',',','?',3]];let data={subject:'Жалпы білім',topic:'Білім саяхаты',minutes:0,q:sample};try{if(location.hash.slice(1)){let d=JSON.parse(decodeURIComponent(location.hash.slice(1)));if(!Array.isArray(d.q)||d.q.length!==7||!d.q.every(x=>Array.isArray(x)&&x.length===6&&x.slice(0,5).every(y=>typeof y==='string')&&Number.isInteger(x[5])&&x[5]>=0&&x[5]<4))throw Error();data=d}}catch(e){alert('Сілтеме жарамсыз. Үлгі ойын ашылады.')}let done=new Set(),end=0,timer=null,expired=false;const colors=['#ad83ff','#38e8ff','#4fdfac','#ffca62','#ff718a','#c191ff','#56b8ff'];function edit(){clearInterval(timer);$('editor').hidden=false;$('game').hidden=true;$('subject').value=data.subject;$('topic').value=data.topic;$('minutes').value=data.minutes;$('fields').replaceChildren();data.q.forEach((q,i)=>{let f=document.createElement('fieldset');let l=document.createElement('legend');l.textContent='Портал '+(i+1);f.append(l);q.slice(0,5).forEach((v,j)=>{let label=document.createElement('label');label.textContent=j?'Жауап '+j:'Сұрақ';let input=document.createElement('input');input.value=v;input.id=`q${i}-${j}`;label.append(input);f.append(label)});let label=document.createElement('label');label.textContent='Дұрыс жауап';let s=document.createElement('select');s.id='correct'+i;for(let j=0;j<4;j++){let o=new Option('Жауап '+(j+1),j);s.add(o)}s.value=q[5];label.append(s);f.append(label);$('fields').append(f)})}function collect(){let q=Array.from({length:7},(_,i)=>[...Array.from({length:5},(_,j)=>$('q'+i+'-'+j).value.trim()),Number($('correct'+i).value)]);if(q.some(x=>x.slice(0,5).some(v=>!v))){$('status').textContent='Барлық сұрақтар мен жауаптарды толтырыңыз.';return false}let minutes=Number($('minutes').value);if(!Number.isInteger(minutes)||minutes<0||minutes>180){$('status').textContent='0–180 аралығындағы бүтін сан енгізіңіз.';return false}data={subject:$('subject').value.trim(),topic:$('topic').value.trim(),minutes,q};return true}function render(){$('heading').textContent=[data.subject,data.topic].filter(Boolean).join(' · ');$('score').textContent=`Ұпай: ${done.size*10}/70 · Ашылған портал: ${done.size}/7`;$('portals').replaceChildren();data.q.forEach((q,i)=>{let b=document.createElement('button');b.className='portal';b.style.setProperty('--c',colors[i]);b.textContent=done.has(i)?'✓':String(i+1).padStart(2,'0');b.disabled=done.has(i)||expired;b.onclick=()=>openQ(i);$('portals').append(b)});$('result').textContent=expired?'Уақыт аяқталды! Нәтиже: '+done.size*10+'/70':done.size===7?'🎉 Барлық портал ашылды! Құттықтаймыз!':'Порталды таңдап, тапсырманы орындаңыз.';if(done.size===7)clearInterval(timer)}function openQ(i){$('question').textContent=data.q[i][0];$('feedback').textContent='';$('answers').replaceChildren();data.q[i].slice(1,5).forEach((a,j)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>{if(expired)return;if(j===data.q[i][5]){done.add(i);$('feedback').textContent='Дұрыс! +10 ұпай';$('answers').querySelectorAll('button').forEach(x=>x.disabled=true);render()}else{$('feedback').textContent='Қате жауап. Қайта байқап көріңіз.';b.disabled=true}};$('answers').append(b)});$('modal').showModal()}function tick(){let seconds=Math.max(0,Math.ceil((end-Date.now())/1000));$('clock').textContent='Қалған уақыт: '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if(!seconds){expired=true;clearInterval(timer);$('modal').close();render()}}function start(){clearInterval(timer);done.clear();expired=false;$('editor').hidden=true;$('game').hidden=false;$('clock').textContent='Уақыт шектеусіз';if(data.minutes>0){end=Date.now()+data.minutes*60000;tick();timer=setInterval(tick,250)}render()}$('teacher').onclick=edit;$('play').onclick=start;$('restart').onclick=start;$('close').onclick=()=>$('modal').close();$('save').onclick=()=>{if(collect())start()};$('share').onclick=async()=>{if(!collect())return;let url=location.href.split('#')[0]+'#'+encodeURIComponent(JSON.stringify(data));$('link').hidden=false;$('link').value=url;try{await navigator.clipboard.writeText(url);$('status').textContent='Сілтеме көшірілді.'}catch(e){$('link').select();$('status').textContent='Сілтемені қолмен көшіріңіз.'}};start();</script></html>

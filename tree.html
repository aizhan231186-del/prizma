<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIZMA TREE</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#51306b,#120b23 75%);color:#fff4dd;font:16px Arial}main{max-width:1150px;margin:auto;padding:22px}h1{font: bold clamp(35px,6vw,65px) Georgia;color:#ffda93;text-shadow:0 0 22px #ffb74e;text-align:center}a{color:#ffdb9a}button,input,textarea,select{font:inherit;color:inherit;background:#2e1943;border:1px solid #e2b86b;border-radius:12px;padding:12px}button{cursor:pointer}input,textarea,select{width:100%;margin:6px 0 14px}section{padding:18px;border:1px solid #cda86488;border-radius:20px;margin:14px 0;background:#21132eaa}.layout{display:grid;grid-template-columns:2fr 1fr;gap:18px}.tree{position:relative;height:570px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#ac4c9c44,transparent 70%);border-radius:20px}.tree svg{position:absolute;width:100%;height:100%}.leaf{position:absolute;width:52px;height:62px;border-radius:75% 8% 75% 8%;background:radial-gradient(ellipse at 25% 20%,white,var(--c) 32%,var(--c) 65%,#361e49);box-shadow:0 0 16px var(--c);border:1px solid #fff8;color:#261333;font-weight:bold;transform:translate(-50%,-50%) rotate(-12deg);animation:bloom .7s ease;z-index:2}.leaf:hover{z-index:3;filter:brightness(1.3)}@keyframes bloom{from{opacity:0;scale:.2}to{opacity:1;scale:1}}.row{display:flex;flex-wrap:wrap;gap:8px}.result{padding:10px;border-bottom:1px solid #ffffff22;overflow-wrap:anywhere;white-space:pre-wrap}dialog{background:#28173c;color:#fff4dd;border:1px solid gold;border-radius:18px;max-width:90%;width:500px}dialog::backdrop{background:#000a}@media(max-width:720px){.layout{grid-template-columns:1fr}.tree{height:440px}}@media print{body{background:white;color:black}button,form,.tree,header{display:none}section{background:white;border:0}}</style><main><header><a href="index.html">← PRIZMA</a> · REFLECT / 010</header><h1>✦ PRIZMA TREE ✦</h1><p style="text-align:center">Ойлар ағашы</p><label>Сабақ тақырыбы<input id="topic" placeholder="Сабақ тақырыбын енгізіңіз"></label><div class="layout"><section><div class="tree" id="tree"><svg viewBox="0 0 600 570" preserveAspectRatio="none"><defs><linearGradient id="gold"><stop stop-color="#663817"/><stop offset=".48" stop-color="#ffdd85"/><stop offset="1" stop-color="#ae692c"/></linearGradient><filter id="light"><feGaussianBlur stdDeviation="4"/></filter></defs><ellipse cx="300" cy="530" rx="200" ry="26" fill="#d6a34b" opacity=".4"/><g id="branches" fill="none" stroke="url(#gold)" stroke-linecap="round"><path d="M300 530 Q240 440 310 340 Q350 255 300 150" stroke-width="35"/><path d="M305 360 Q225 300 95 180 M310 325 Q385 245 510 160 M307 272 Q200 220 175 85 M310 245 Q380 155 420 65 M300 190 Q285 95 300 40" stroke-width="15"/></g><g id="flowers"></g></svg></div><p id="count" aria-live="polite"></p></section><section><form id="form"><label>Пікір түрі<select id="kind"></select></label><label>Есім (міндетті емес)<input id="who" maxlength="60"></label><label>Пікір<textarea id="note" required maxlength="600" rows="5"></textarea></label><button type="submit">🍃 Жапырақ қосу</button></form><p>Пікірлер осы құрылғыда ғана сақталады. Жеке мәлімет жазбаған дұрыс.</p><div class="row"><button id="save">Сақтау</button><button id="load">Ашу</button><button id="print">Басып шығару</button><button id="reset">Жаңа сабақ</button></div><p id="status" aria-live="polite"></p></section></div><section><h2>Нәтиже</h2><div id="stats"></div><div id="list"></div></section></main><dialog id="detail"><h2 id="heading"></h2><p id="body" style="white-space:pre-wrap;overflow-wrap:anywhere"></p><button id="close">Жабу</button></dialog><script>const $=x=>document.getElementById(x),types=['Сабақты түсіндім','Жаңа ақпарат алдым','Сұрағым бар','Ұсынысым бар','Сабақтан алған әсерім'],colors=['#a6ed65','#ffd05c','#66d9ff','#c48cff','#ff91c5'];let data=[];const key='prizma-tree-v1';types.forEach((t,i)=>{let o=document.createElement('option');o.value=i;o.textContent=t;$('kind').append(o)});let ns='http://www.w3.org/2000/svg';for(let i=0;i<140;i++){let a=i*2.39996,r=Math.sqrt((i+.5)/140),x=300+Math.cos(a)*r*245,y=185+Math.sin(a)*r*150;let c=document.createElementNS(ns,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',2+i%5);c.setAttribute('fill',['#ffdf8b','#f89cdd','#c38eff'][i%3]);c.setAttribute('opacity',.35+i%5*.12);$('flowers').append(c)}function show(n){let d=data[n];$('heading').textContent=types[d.k];$('body').textContent=(d.w||'Аноним')+' — '+d.n;$('detail').showModal()}function render(){$('tree').querySelectorAll('button').forEach(x=>x.remove());data.slice(-80).forEach((d,i)=>{let b=document.createElement('button'),a=i*2.39996,r=Math.sqrt((i+.5)/80);b.className='leaf';b.style.setProperty('--c',colors[d.k]);b.style.left=(50+Math.cos(a)*r*42)+'%';b.style.top=(34+Math.sin(a)*r*28)+'%';b.textContent=Math.max(0,data.length-80)+i+1;b.title=types[d.k];b.onclick=()=>show(Math.max(0,data.length-80)+i);$('tree').append(b)});$('count').textContent=data.length+' пікір · соңғы 80 жапырақ ағашта көрінеді';$('stats').replaceChildren();types.forEach((t,i)=>{let p=document.createElement('p');p.style.color=colors[i];p.textContent=t+' — '+data.filter(d=>d.k===i).length;$('stats').append(p)});$('list').replaceChildren();data.forEach((d,i)=>{let p=document.createElement('div');p.className='result';p.textContent=(i+1)+'. '+types[d.k]+' · '+(d.w||'Аноним')+' — '+d.n;$('list').append(p)})}$('form').onsubmit=e=>{e.preventDefault();let n=$('note').value.trim();if(!n)return;data.push({k:+$('kind').value,w:$('who').value.trim(),n});$('note').value='';$('who').value='';render()};$('close').onclick=()=>$('detail').close();$('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify({topic:$('topic').value,data}));$('status').textContent='Сақталды'}catch{$('status').textContent='Сақтау мүмкін болмады'}};$('load').onclick=()=>{try{let d=JSON.parse(localStorage.getItem(key));if(!d||!Array.isArray(d.data))throw Error();data=d.data;$('topic').value=d.topic||'';render();$('status').textContent='Ашылды'}catch{$('status').textContent='Сақталған пікір жоқ'}};$('reset').onclick=()=>{if(confirm('Экрандағы пікірлерді тазарту керек пе?')){data=[];$('topic').value='';render()}};$('print').onclick=()=>window.print();render();</script></html>

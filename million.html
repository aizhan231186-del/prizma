<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIZMA MILLION</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#243878,#070b22 75%);color:#fff;font:16px Arial;min-height:100vh}main{max-width:1050px;margin:auto;padding:24px}a{color:#c9b9ff}h1{text-align:center;color:#ffda83;font-size:clamp(30px,6vw,64px);letter-spacing:3px}button,input,select,textarea{font:inherit;color:white;background:#172955;border:1px solid #8c8bc4;border-radius:12px;padding:12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}input,textarea{width:100%;margin:5px 0}section,fieldset{border:1px solid #756bb1;border-radius:20px;padding:18px;margin:15px 0;background:#101a3a}.row{display:flex;flex-wrap:wrap;gap:8px}.stage{display:grid;grid-template-columns:1fr 180px;gap:18px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answers button{min-height:65px;border-color:#bba56b}.correct{background:#176c47!important}.wrong{background:#923444!important}.ladder div{padding:5px 10px;color:#ffda83}.now{background:#695126;border-radius:9px;color:white!important}#question{min-height:100px;text-align:center;display:grid;place-items:center}#score{text-align:center;color:#ffda83;font-size:32px}small{color:#c0c6e3}[hidden]{display:none!important}@media(max-width:650px){.stage{grid-template-columns:1fr}.ladder{display:none}.answers{grid-template-columns:1fr}}</style><main><a href="index.html">← PRIZMA</a><p>◈ PRIZMA / 005</p><h1>✦ PRIZMA MILLION ✦</h1><p style="text-align:center">Білімнің биігіне қадам бас!</p><div class="row" id="nav"><button id="edit">Мұғалім режимі</button><button id="play">Ойын режимі</button></div><section id="editor" hidden><label>Пән<input id="subject"></label><label>Тақырып<input id="topic"></label><div id="fields"></div><div class="row"><button id="save">Сақтау</button><button id="fresh">Жаңа ойын</button><select id="library"></select><button id="load">Ашу</button><button id="share">Сілтемені көшіру</button></div><p id="status"></p><small>Ойындар осы браузерде сақталады. Сілтемеде сұрақтар мен жауаптар қамтылады. Жеке деректер енгізбеңіз.</small></section><section id="game"><h2 id="heading"></h2><div class="stage"><div><div id="score"></div><p id="progress"></p><div class="row"><button id="half">50/50</button><button id="audience">Аудитория көмегі</button><button id="swap">Сұрақты ауыстыру</button><button id="sound">🔊 Дыбыс</button></div><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>Келесі сұрақ →</button><button id="reset">Қайта бастау</button></div><div id="ladder" class="ladder"></div></div></section></main><script>
const $=id=>document.getElementById(id),key='prizma-million-v1', levels=[100,200,300,500,1000,2000,4000,8000,16000,32000,64000,125000,250000,500000,1000000], sample={subject:'Қазақ әдебиеті',topic:'Абай әлемі',q:[["Абайдың туған жылы?",["1845","1855","1835","1865"],0],["Абайдың шын есімі?",["Ахмет","Ибраһим","Шәкәрім","Оспан"],1],["Абайдың әжесі?",["Ұлжан","Айгерім","Зере","Ділдә"],2],["Абайдың әкесі?",["Ырғызбай","Өскенбай","Кеңгірбай","Құнанбай"],3],["Абайдың прозалық мұрасы?",["Қара сөздер","Мақалдар","Ертегілер","Пьесалар"],0],["Қара сөздер саны?",["40","45","50","55"],1],["Абай жолы романын кім жазды?",["С. Мұқанов","Ғ. Мүсірепов","М. Әуезов","Б. Майлин"],2],["Абайдың табиғат лирикасына жататын өлең?",["Сегіз аяқ","Интернатта оқып жүр","Әсемпаз болма әрнеге","Қыс"],3],["Қыс өлеңіндегі басты көркемдік тәсіл?",["Кейіптеу","Гипербола","Ирония","Аллегория"],0],["Абай аударған ақын?",["Шекспир","Лермонтов","Гомер","Данте"],1],["Жетінші сөздің негізгі ұғымдары?",["Әдет пен дәстүр","Өнер мен кәсіп","Тән мен жан құмары","Дос пен дұшпан"],2],["Он жетінші сөздегі төреші?",["Қайрат","Ақыл","Жүрек","Ғылым"],3],["Бес асыл іске жататын қасиет?",["Рақым","Мақтаншақтық","Өсек","Еріншектік"],0],["Отыз бірінші сөздің негізгі мәселесі?",["Табиғат","Есте сақтау","Сауда","Музыка"],1],["Толық адам ілімінің тірегі?",["Байлық пен атақ","Күш пен билік","Ақыл, қайрат, жүрек","Тек білім"],2],["Абайдың әнін атаңыз.",["Ақ сиса","Балқадиша","Гауһартас","Көзімнің қарасы"],3]]};let data=structuredClone(sample),shared=false,id=null,step=0,score=0,locked=false,over=false,helps={},swapped=false,sound=true,ctx;function valid(d){return d&&typeof d.subject==='string'&&typeof d.topic==='string'&&Array.isArray(d.q)&&d.q.length===16&&d.q.every(v=>Array.isArray(v)&&typeof v[0]==='string'&&Array.isArray(v[1])&&v[1].length===4&&v[1].every(x=>typeof x==='string')&&Number.isInteger(v[2])&&v[2]>=0&&v[2]<4)}try{if(location.hash){let d=JSON.parse(decodeURIComponent(location.hash.slice(1)));if(valid(d)){data=d;shared=true}}}catch{}function el(t,txt,p){let e=document.createElement(t);if(txt!==null)e.textContent=txt;p.append(e);return e}function tone(ok){if(!sound)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(ok?520:220,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(ok?880:100,ctx.currentTime+.35);g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.45);o.start();o.stop(ctx.currentTime+.5)}catch{}}function current(){return data.q[swapped?15:step]}function fmt(n){return n.toLocaleString('kk-KZ')}function render(){ $('heading').textContent=data.subject+' · '+data.topic;$('score').textContent=fmt(score)+' ұпай';$('progress').textContent=over?'Ойын аяқталды':(step+1)+' / 15 · '+fmt(levels[step])+' ұпай';$('ladder').replaceChildren();for(let i=14;i>=0;i--){let e=el('div',(i+1)+' · '+fmt(levels[i]),$('ladder'));if(i===step)e.className='now'}$('answers').replaceChildren();$('feedback').textContent='';$('next').hidden=true;for(let h of ['half','audience','swap'])$(h).disabled=over||!!helps[h];if(over){$('question').textContent=score===1000000?'🏆 МИЛЛИОН!':'Ойын аяқталды';$('feedback').textContent='Қорытынды: '+fmt(score)+' ұпай';return}locked=false;let q=current();$('question').textContent=q[0];q[1].forEach((a,i)=>{let b=el('button','ABCD'[i]+': '+a,$('answers'));b.onclick=()=>answer(i)})}function answer(i){if(locked||over)return;locked=true;let q=current(),ok=i===q[2],bs=$('answers').children;Array.from(bs).forEach(b=>b.disabled=true);bs[q[2]].classList.add('correct');if(!ok)bs[i].classList.add('wrong');tone(ok);for(let h of ['half','audience','swap'])$(h).disabled=true;if(ok){score=levels[step];$('score').textContent=fmt(score)+' ұпай';$('feedback').textContent=step===14?'🏆 Құттықтаймыз! Миллион ұпай!':'Дұрыс жауап!';if(step===14){over=true;return}$('next').hidden=false}else{over=true;$('progress').textContent='Ойын аяқталды';$('feedback').textContent='Қате жауап. Қорытынды: '+fmt(score)+' ұпай'}}function reset(){step=0;score=0;locked=false;over=false;helps={};swapped=false;render()}$('next').onclick=()=>{step++;swapped=false;render()};$('reset').onclick=reset;$('half').onclick=()=>{if(locked||helps.half)return;helps.half=true;$('half').disabled=true;let wrong=[0,1,2,3].filter(i=>i!==current()[2]).sort(()=>Math.random()-.5);wrong.slice(0,2).forEach(i=>$('answers').children[i].hidden=true)};$('audience').onclick=()=>{if(locked||helps.audience)return;helps.audience=true;$('audience').disabled=true;$('feedback').textContent='Аудиторияға сұрақ қойыңыз: қай нұсқа дұрыс? Дауыс беру нәтижесін мұғалім анықтайды.'};$('swap').onclick=()=>{if(locked||helps.swap)return;helps.swap=true;swapped=true;render()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Дыбыс':'🔇 Дыбыс'};function lib(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}}function library(){let s=$('library');s.replaceChildren();el('option','Сақталған ойынды таңдаңыз',s).value='';Object.entries(lib()).forEach(([k,d])=>el('option',d.subject+' · '+d.topic,s).value=k);s.value=id||''}function fill(){for(let k of ['subject','topic'])$(k).value=data[k];$('fields').replaceChildren();data.q.forEach((q,i)=>{let f=el('fieldset',null,$('fields'));el('legend',i===15?'Қосалқы сұрақ':(i+1)+'-сұрақ · '+fmt(levels[i])+' ұпай',f);let t=el('textarea',null,f);t.id='q'+i;t.value=q[0];q[1].forEach((a,j)=>{el('label','ABCD'[j]+' нұсқасы',f);let x=el('input',null,f);x.id='a'+i+'_'+j;x.value=a});el('label','Дұрыс жауап',f);let s=el('select',null,f);s.id='c'+i;for(let j=0;j<4;j++)el('option','ABCD'[j],s).value=j;s.value=q[2]});library()}function collect(){let d={subject:$('subject').value.trim(),topic:$('topic').value.trim(),q:Array.from({length:16},(_,i)=>[$('q'+i).value.trim(),Array.from({length:4},(_,j)=>$('a'+i+'_'+j).value.trim()),Number($('c'+i).value)])};if(!valid(d)||!d.subject||!d.topic||d.q.some(q=>!q[0]||q[1].some(a=>!a))){$('status').textContent='Барлық өрістерді толтырыңыз.';return false}data=d;return true}$('edit').onclick=()=>{fill();$('editor').hidden=false;$('game').hidden=true};$('play').onclick=()=>{if(!$('editor').hidden&&!collect())return;$('editor').hidden=true;$('game').hidden=false;reset()};$('fresh').onclick=()=>{id=null;data=structuredClone(sample);fill()};$('save').onclick=()=>{if(!collect())return;try{let l=lib();id=id||String(Date.now());l[id]=data;localStorage.setItem(key,JSON.stringify(l));library();$('status').textContent='Сақталды.'}catch{$('status').textContent='Сақтау мүмкін болмады.'}};$('load').onclick=()=>{let k=$('library').value,d=lib()[k];if(valid(d)){id=k;data=d;fill();$('status').textContent='Ашылды.'}};$('share').onclick=async()=>{if(!collect())return;let u=new URL(location.href);u.search='';u.hash=encodeURIComponent(JSON.stringify(data));try{await navigator.clipboard.writeText(u.href);$('status').textContent='Сілтеме көшірілді.'}catch{prompt('Сілтемені көшіріңіз:',u.href)}};if(shared){$('editor').remove();$('nav').remove()}reset();</script></html>

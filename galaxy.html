<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIZMA GALAXY</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#283d72,#080c22 75%);color:#fff;font:16px Arial;min-height:100vh}main{max-width:1050px;margin:auto;padding:24px}h1{text-align:center;color:#ffdb98;font-size:clamp(30px,6vw,65px)}a{color:#d6b9ff}section{background:#ffffff09;border:1px solid #ad83cc66;border-radius:22px;padding:20px;margin:18px 0}button,input,textarea,select{font:inherit;background:#2c214b;color:white;border:1px solid #a488d0;border-radius:12px;padding:12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}textarea,input{width:100%;margin:8px 0}textarea{min-height:100px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:15px;margin:24px 0}.door{height:170px;border-radius:65px 65px 10px 10px;border:2px solid #e7bd73;box-shadow:0 0 20px #d9a7ff66,inset 0 0 25px #a575e844;background:linear-gradient(100deg,#261344,#654184,#241340);font-size:34px;transition:transform .3s}.door:hover:not(:disabled){transform:translateY(-7px)}.door.open{animation:glow .65s ease}@keyframes glow{50%{transform:scale(1.08);box-shadow:0 0 65px #ffdb86}}#reveal{text-align:center;font-size:clamp(22px,4vw,38px);color:#ffda86;min-height:70px}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.group{padding:15px;border:1px solid var(--c);border-radius:15px;background:#ffffff09}.group h3{color:var(--c)}li{margin:7px 0;overflow-wrap:anywhere}[hidden]{display:none!important}@media print{body{background:white;color:black}#setup,#play,#actions,header,a{display:none!important}.group{border:1px solid #444}.group h3{color:black}section{border:0}}#sky{isolation:isolate;height:clamp(400px,65vh,680px)!important;background:radial-gradient(ellipse at 30% 20%,#202048,#070a20 55%,#02030c)!important}.nebula{position:absolute;inset:-25%;pointer-events:none;background:radial-gradient(ellipse at 25% 35%,#a12cff55,transparent 35%),radial-gradient(ellipse at 65% 60%,#007eff66,transparent 35%),radial-gradient(ellipse at 80% 15%,#ff468b44,transparent 25%);filter:blur(24px);animation:neb 12s ease-in-out infinite alternate}.cosmic-dot{animation:twinkle 2s infinite alternate;text-shadow:0 0 12px white}.cosmic-star{z-index:3;font-weight:bold;text-shadow:0 0 5px currentColor,0 0 15px currentColor!important;transition:left 4s cubic-bezier(.3,.1,.2,1),top 4s cubic-bezier(.3,.1,.2,1),color 2s!important}.cosmic-star::before{content:'';position:absolute;right:90%;width:48px;height:2px;top:50%;background:linear-gradient(90deg,transparent,currentColor);opacity:.8}.cluster{z-index:1;opacity:.2;transition:opacity 2s;animation:halo 3s infinite alternate}.arrived .cluster{opacity:1}.arrived .cosmic-star{animation:twinkle 2s infinite alternate}.galaxy-lines{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;opacity:0;transition:opacity 1s}.arrived .galaxy-lines{opacity:1}@keyframes neb{to{transform:translate(8%,-5%) rotate(15deg) scale(1.12)}}@keyframes twinkle{0%{opacity:.35;filter:brightness(.8)}100%{opacity:1;filter:brightness(1.6)}}@keyframes halo{to{filter:brightness(1.8)}}@media(prefers-reduced-motion:reduce){#sky *{animation:none!important;transition:none!important}}#sky{perspective:650px;background:radial-gradient(ellipse at 25% 30%,#202451 0%,#080d23 40%,#010209 85%)!important}.cosmic-dot{font-size:0!important;width:var(--star-size);height:var(--star-size);border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff 12%,#cce4ff 24%,#729aff80 44%,transparent 72%);box-shadow:0 0 15px #b8d7ff66;animation:depthflight 12s linear infinite!important}.cosmic-dot:nth-child(9n){background:radial-gradient(circle,#fff 0%,#fff1d4 15%,#fac07480 35%,transparent 72%);box-shadow:0 0 25px #ffd69966}.cosmic-star{overflow:visible!important;max-width:none!important;font-size:11px!important;display:flex;align-items:center;gap:8px;text-shadow:0 1px 4px #000!important;filter:none!important}.cosmic-star::before{position:relative;right:auto;top:auto;flex:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#fff 10%,#f5ecff 17%,currentColor 28%,transparent 70%);box-shadow:0 0 20px currentColor;opacity:1}.cosmic-star::after{content:'';position:absolute;left:-5px;top:50%;width:40px;height:1px;background:linear-gradient(90deg,transparent,currentColor,white,currentColor,transparent);box-shadow:0 0 7px currentColor}.arrived .cosmic-star{font-size:0!important;animation:none!important}.arrived .cosmic-star::before{width:34px;height:34px}.cluster{background:radial-gradient(ellipse, #728cff15,transparent 65%);border-style:dashed!important;align-items:end!important;padding-bottom:8px;text-shadow:0 0 12px currentColor}.nebula{filter:blur(35px);opacity:.8}@keyframes depthflight{0%{transform:translateZ(-350px) scale(.4);opacity:.15}80%{opacity:1}100%{transform:translate3d(var(--dx),var(--dy),180px) scale(1.5);opacity:0}}@media(prefers-reduced-motion:reduce){#sky .cosmic-dot{animation:none!important}}</style><main><header><a href="index.html">← PRIZMA</a><p>◈ PRIZMA / 008</p></header><h1>✦ PRIZMA GALAXY ✦</h1><p style="text-align:center">Әр білім алушы — бір жұлдыз</p><section id="setup"><label>Білім алушылар (әр жолға бір есім немесе бүркеншік ат)<textarea id="names" placeholder="Аружан&#10;Дана&#10;Әли"></textarea></label><label>Топ саны <select id="count"></select></label><div id="labels"></div><div class="row"><button id="start">Ғарыштық саяхатты бастау</button><button id="load">Сақталған нәтижені ашу</button></div><p id="status" aria-live="polite"></p><small>Тізім серверге жіберілмейді. Сақтау осы браузерде ғана жүргізіледі.</small></section><section id="play" hidden><p id="progress"></p><div id="sky" style="position:relative;height:420px;overflow:hidden;background:radial-gradient(ellipse at 30% 20%,#453078,#101c49 45%,#070b20 85%);border-radius:20px"></div><div id="reveal" aria-live="polite"></div><button id="sound">🔊 Дыбыс</button></section><section id="results" hidden><h2>Топтар құрамы</h2><div id="groups" class="groups"></div><div class="row" id="actions" style="margin-top:18px"><button id="save">Нәтижені сақтау</button><button id="again">Қайта бөлу</button><button id="edit">Тізімді өзгерту</button><button id="print">Басып шығару</button></div><p id="notice"></p></section></main><script>
const $=id=>document.getElementById(id),key='prizma-galaxy-v1',colors=['#c5a4ff','#62ddee','#ffcf75','#ff92b0','#8be7af','#87a9ff','#f6a778','#dacbff'];let names=[],labels=[],groups=[],pool=[],remaining=[],sound=true,ctx,flight=0;function el(t,txt,p){let e=document.createElement(t);if(txt!==null)e.textContent=txt;p.append(e);return e}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}for(let i=2;i<=8;i++)el('option',String(i),$('count')).value=i;$('count').value=3;function fields(){let prev=Array.from($('labels').querySelectorAll('input')).map(x=>x.value);$('labels').replaceChildren();for(let i=0;i<Number($('count').value);i++){let n=el('input',null,$('labels'));n.value=prev[i]||['Сириус','Вега','Орион','Альтаир','Кассиопея','Андромеда','Лира','Феникс'][i];n.setAttribute('aria-label',(i+1)+'-топ атауы')}}fields();$('count').onchange=fields;function tone(){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();[440,660,880].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.12;o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.3)})}catch{}}function start(){let token=++flight;groups=labels.map(()=>[]);let order=shuffle(labels.map((_,i)=>i));pool=shuffle(names.map((_,i)=>order[i%labels.length]));remaining=names.map((_,i)=>i);$('setup').hidden=true;$('play').hidden=false;$('results').hidden=true;$('notice').textContent='';$('reveal').textContent='Жұлдыздар ғарышта қозғалып жатыр…';$('progress').textContent=names.length+' жұлдыз · '+labels.length+' шоқжұлдыз';let sky=$('sky');sky.replaceChildren();sky.classList.remove('arrived');el('div',null,sky).className='nebula';for(let j=0;j<150;j++){let z=el('span',j%9===0?'✦':'·',sky);z.className='cosmic-dot';z.style.setProperty('--star-size',(j%11===0?20:3+j%7)+'px');z.style.setProperty('--dx',((Math.random()-.5)*160)+'px');z.style.setProperty('--dy',((Math.random()-.5)*160)+'px');z.style.cssText='position:absolute;color:#ffffff88;pointer-events:none;left:'+Math.random()*98+'%;top:'+Math.random()*98+'%;font-size:'+((j%3+1)*7)+'px';z.style.animationDelay=-(j%120)/10+'s'}let cols=Math.min(labels.length,4),rows=Math.ceil(labels.length/cols);let centers=labels.map((l,i)=>({x:(i%cols+.5)*100/cols,y:(Math.floor(i/cols)+.5)*100/rows}));centers.forEach((c,i)=>{let z=el('div',ltext(i),sky);z.className='cluster';z.style.cssText='position:absolute;left:'+c.x+'%;top:'+c.y+'%;transform:translate(-50%,-50%);width:22%;height:'+Math.min(40,80/rows)+'%;border:1px solid '+colors[i]+';border-radius:50%;display:grid;place-items:center;color:'+colors[i]+';font-weight:bold;text-align:center;box-shadow:0 0 24px '+colors[i]+'55;font-size:13px'});let stars=names.map((n,i)=>{let z=el('span',n,sky);z.className='cosmic-star';z.title=n;z.style.cssText='position:absolute;left:'+Math.random()*85+'%;top:'+Math.random()*90+'%;font-size:12px;color:white;text-shadow:0 0 9px white;transition:left 2s ease,top 2s ease,color 1s,opacity 1s;white-space:nowrap;max-width:20%;overflow:hidden;text-overflow:ellipsis';return z});ambient(token);setTimeout(()=>{if(token!==flight)return;stars.forEach((z,i)=>{z.style.left=(5+Math.random()*80)+'%';z.style.top=(5+Math.random()*85)+'%'});},100);setTimeout(()=>{if(token!==flight)return;stars.forEach((z,i)=>{let k=pool[i],c=centers[k],members=pool.map((v,j)=>v===k?j:-1).filter(j=>j>=0),rank=members.indexOf(i),angle=rank*2.399963,radius=Math.sqrt((rank+.5)/members.length);z.style.left=Math.max(1,Math.min(94,c.x-2+Math.cos(angle)*radius*8))+'%';z.style.top=Math.max(1,Math.min(94,c.y-3+Math.sin(angle)*radius*Math.min(15,32/rows)))+'%';z.style.color=colors[k]});tone()},5500);setTimeout(()=>{if(token!==flight)return;sky.classList.add('arrived');const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('class','galaxy-lines');sky.append(svg);labels.forEach((_,k)=>{let list=stars.filter((z,i)=>pool[i]===k);for(let j=1;j<list.length;j++){let line=document.createElementNS(ns,'line');for(let [attr,v] of Object.entries({x1:parseFloat(list[j-1].style.left)+1,y1:parseFloat(list[j-1].style.top)+1,x2:parseFloat(list[j].style.left)+1,y2:parseFloat(list[j].style.top)+1,stroke:colors[k],'stroke-width':'.16','stroke-opacity':'.7'}))line.setAttribute(attr,v);svg.append(line)}});names.forEach((n,i)=>groups[pool[i]].push(n));remaining=[];pool=[];$('results').hidden=false;$('reveal').textContent='Шоқжұлдыздар қалыптасты!';$('progress').textContent='Барлығы топқа бөлінді!';render();tone()},12000)}function ambient(token){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();for(let i=0;i<24;i++){let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.5;o.type='sine';o.frequency.value=[130.81,196,261.63,329.63,392,523.25][i%6];o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.025,t+.22);g.gain.exponentialRampToValueAtTime(.0001,t+1.3);o.start(t);o.stop(t+1.4);ambientNodes.push(o)}}catch{}}let ambientNodes=[];function ltext(i){return '✦ '+labels[i]}function render(){$('groups').replaceChildren();groups.forEach((g,i)=>{let card=el('div',null,$('groups'));card.className='group';card.style.setProperty('--c',colors[i]);el('h3',labels[i]+' · '+g.length,card);let ul=el('ol',null,card);g.forEach(n=>el('li',n,ul))});$('save').disabled=remaining.length>0;$('print').disabled=remaining.length>0;}$('start').onclick=()=>{let n=$('names').value.split(/\n/).map(x=>x.trim()).filter(Boolean),l=Array.from($('labels').querySelectorAll('input')).map(x=>x.value.trim());if(n.length<l.length||n.length>200||l.some(x=>!x)||new Set(l).size!==l.length){$('status').textContent='2–200 есім енгізіңіз. Адам саны топ санынан кем болмауы және топ атаулары бірегей болуы керек.';return}names=n;labels=l;start()};$('again').onclick=start;$('edit').onclick=()=>{flight++;$('setup').hidden=false;$('play').hidden=true;$('results').hidden=true};$('sound').onclick=()=>{sound=!sound;if(!sound){ambientNodes.forEach(o=>{try{o.stop()}catch{}});ambientNodes=[];}$('sound').textContent=sound?'🔊 Дыбыс':'🔇 Дыбыс'};$('print').onclick=()=>window.print();$('save').onclick=()=>{if(remaining.length)return;try{localStorage.setItem(key,JSON.stringify({names,labels,groups}));$('notice').textContent='Нәтиже сақталды.'}catch{$('notice').textContent='Сақтау мүмкін болмады.'}};$('load').onclick=()=>{try{let d=JSON.parse(localStorage.getItem(key));if(!d||!Array.isArray(d.names)||!Array.isArray(d.labels)||!Array.isArray(d.groups)||d.groups.length!==d.labels.length)throw Error();({names,labels,groups}=d);remaining=[];pool=[];$('names').value=names.join('\n');$('count').value=labels.length;fields();Array.from($('labels').querySelectorAll('input')).forEach((x,i)=>x.value=labels[i]);$('setup').hidden=true;$('play').hidden=true;$('results').hidden=false;render();$('notice').textContent='Сақталған нәтиже ашылды.'}catch{$('status').textContent='Сақталған нәтиже табылмады.'}};</script></html>

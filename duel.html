<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIZMA DUEL</title><style>*{box-sizing:border-box}body{margin:0;color:white;background:radial-gradient(ellipse at top,#282844,#090d20 75%);font:16px Arial}main{max-width:1000px;margin:auto;padding:24px}h1{text-align:center;font-size:clamp(32px,7vw,70px)}a{color:#babaff}button,input,textarea,select{font:inherit;color:white;background:#242b48;border:1px solid #777eaa;border-radius:12px;padding:12px}button{cursor:pointer}button:disabled{opacity:.35}input,textarea{width:100%;margin:5px 0}section,fieldset{border:1px solid #525b83;border-radius:20px;padding:18px;margin:15px 0;background:#141a32}.row{display:flex;gap:8px;flex-wrap:wrap}.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{text-align:center;padding:20px 8px;border-radius:20px;background:linear-gradient(145deg,#153c91,#101b48);border:2px solid #4cbcff}.player:nth-child(2){background:linear-gradient(145deg,#972d56,#40152d);border-color:#ff6296}.player.active{box-shadow:0 0 28px #fff9}.player b{display:block;font-size:48px;margin:10px}.player button{width:100%;min-height:70px}#clock{text-align:center;font-size:42px;color:#ffdc83}#question{text-align:center;min-height:75px}#feedback,#answer{text-align:center}#answer{color:#aaf2bf}[hidden]{display:none!important}</style><main><a href="index.html">← PRIZMA</a><p>◈ PRIZMA / 006</p><h1>⚔ PRIZMA DUEL</h1><p style="text-align:center">Білім. Жылдамдық. Жеңіс.</p><div class="row" id="nav"><button id="edit">Мұғалім режимі</button><button id="play">Ойын режимі</button></div><section id="editor" hidden><label>Пән<input id="subject"></label><label>Тақырып<input id="topic"></label><label>1-ойыншы<input id="n0"></label><label>2-ойыншы<input id="n1"></label><label>Уақыт (секунд)<input id="seconds" type="number" min="5" max="120"></label><div id="fields"></div><div class="row"><button id="save">Сақтау</button><button id="fresh">Жаңа ойын</button><select id="library"></select><button id="load">Ашу</button><button id="share">Сілтемені көшіру</button></div><p id="status"></p></section><section id="game"><h2 id="heading"></h2><div class="arena"><div class="player" id="p0"><span id="name0"></span><b id="s0">0</b><button id="b0">ЖАУАП БЕРУ · A</button></div><div class="player" id="p1"><span id="name1"></span><b id="s1">0</b><button id="b1">ЖАУАП БЕРУ · L</button></div></div><p id="progress"></p><div id="clock"></div><h2 id="question"></h2><p id="feedback" aria-live="polite"></p><p id="answer" hidden></p><div class="row"><button id="start">Сұрақты бастау</button><button id="reveal" disabled>Жауапты көрсету</button><button id="correct" disabled>Дұрыс +10</button><button id="wrong" disabled>Қате</button><button id="next" disabled>Келесі сұрақ</button><button id="reset">Қайта бастау</button><button id="sound">🔊 Дыбыс</button></div></section></main><script>
const $=id=>document.getElementById(id),key='prizma-duel-v1',sample={subject:'Қазақ әдебиеті',topic:'Абай әлемі',names:['1-ойыншы','2-ойыншы'],seconds:15,q:[["Абай қай жылы дүниеге келді?","1845"],["Абайдың шын есімі?","Ибраһим"],["Абайдың әжесі кім?","Зере"],["Абайдың анасы кім?","Ұлжан"],["Абайдың әкесі кім?","Құнанбай"],["Қара сөздер саны қанша?","45"],["Абай жолының авторы кім?","Мұхтар Әуезов"],["Абай қай жылы қайтыс болды?","1904"],["Абайдың алғашқы өлеңдер жинағы қай жылы шықты?","1909"],["Абайдың бір әнін атаңыз.","Мысалы, Көзімнің қарасы"],["Қыс өлеңіндегі көркемдік тәсіл?","Кейіптеу"],["Абай аударған орыс ақынының бірін атаңыз.","Пушкин, Лермонтов немесе Крылов"],["Бес асыл істің бірін атаңыз.","Талап, еңбек, терең ой, қанағат, рақым"],["Бес дұшпанның бірін атаңыз.","Өсек, өтірік, мақтаншақ, еріншек, бекер мал шашпақ"],["Он жетінші сөзде төрелік айтатын кім?","Ғылым"],["Жетінші сөздегі екі құмарлық?","Тән және жан құмары"],["Отыз бірінші сөздің негізгі тақырыбы?","Есте сақтау"],["Абайдың бір поэмасын атаңыз.","Ескендір, Масғұт, Әзім әңгімесі"],["Абай туған өңір?","Шыңғыстау"],["Толық адам іліміндегі үш негізгі қасиет?","Ақыл, қайрат, жүрек"]]};let data=structuredClone(sample),shared=false,id=null,step=0,scores=[0,0],state='ready',active=-1,timer,deadline=0,sound=true,ctx;function valid(d){return d&&typeof d.subject==='string'&&typeof d.topic==='string'&&Array.isArray(d.names)&&d.names.length===2&&d.names.every(n=>typeof n==='string'&&n.trim())&&Number.isInteger(d.seconds)&&d.seconds>=5&&d.seconds<=120&&Array.isArray(d.q)&&d.q.length===20&&d.q.every(q=>Array.isArray(q)&&q.length===2&&q.every(x=>typeof x==='string'&&x.trim()))}try{if(location.hash){let d=JSON.parse(decodeURIComponent(location.hash.slice(1)));if(valid(d)){data=d;shared=true}}}catch{}function el(t,txt,p){let e=document.createElement(t);if(txt!==null)e.textContent=txt;p.append(e);return e}function tone(f){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.06,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.25);o.start();o.stop(ctx.currentTime+.3)}catch{}}function controls(){for(let i=0;i<2;i++){$('b'+i).disabled=state!=='open';$('p'+i).classList.toggle('active',active===i);$('s'+i).textContent=scores[i]}$('start').disabled=state!=='ready';$('correct').disabled=state!=='locked';$('wrong').disabled=state!=='locked';$('reveal').disabled=!['locked','done'].includes(state);$('next').disabled=state!=='done'}function ready(){clearInterval(timer);active=-1;state=step===20?'end':'ready';$('heading').textContent=data.subject+' · '+data.topic;data.names.forEach((n,i)=>$('name'+i).textContent=n);$('progress').textContent=state==='end'?'20 / 20':(step+1)+' / 20';$('clock').textContent=state==='end'?'🏆':data.seconds;$('question').textContent=state==='end'?(scores[0]===scores[1]?'Тең нәтиже!':'Жеңімпаз: '+data.names[scores[0]>scores[1]?0:1]):'Келесі сұраққа дайынсыз ба?';$('feedback').textContent='';$('answer').hidden=true;controls()}function start(){if(state!=='ready')return;state='open';$('question').textContent=data.q[step][0];$('answer').textContent=data.q[step][1];deadline=Date.now()+data.seconds*1000;controls();tone(440);timer=setInterval(()=>{let n=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('clock').textContent=n;if(!n){clearInterval(timer);state='done';$('feedback').textContent='Уақыт аяқталды';controls();tone(180)}},100)}function buzz(i){if(state!=='open')return;if(Date.now()>=deadline)return;clearInterval(timer);active=i;state='locked';$('feedback').textContent=data.names[i]+' жауап береді';controls();tone(i?660:520)}function grade(ok){if(state!=='locked')return;if(ok)scores[active]+=10;state='done';$('feedback').textContent=ok?'Дұрыс! +10 ұпай':'Қате жауап';$('answer').hidden=false;controls();tone(ok?880:180)}$('start').onclick=start;$('b0').onclick=()=>buzz(0);$('b1').onclick=()=>buzz(1);document.addEventListener('keydown',e=>{if($('game').hidden||e.repeat||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.code==='KeyA')buzz(0);if(e.code==='KeyL')buzz(1)});$('correct').onclick=()=>grade(true);$('wrong').onclick=()=>grade(false);$('reveal').onclick=()=>$('answer').hidden=false;$('next').onclick=()=>{if(state==='done'){step++;ready()}};function reset(){step=0;scores=[0,0];ready()}$('reset').onclick=reset;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Дыбыс':'🔇 Дыбыс'};function lib(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}}function library(){let s=$('library');s.replaceChildren();el('option','Сақталған ойынды таңдаңыз',s).value='';Object.entries(lib()).forEach(([k,d])=>el('option',d.subject+' · '+d.topic,s).value=k);s.value=id||''}function fill(){for(let k of ['subject','topic','seconds'])$(k).value=data[k];data.names.forEach((n,i)=>$('n'+i).value=n);$('fields').replaceChildren();data.q.forEach((q,i)=>{let f=el('fieldset',null,$('fields'));el('legend',(i+1)+'-сұрақ',f);q.forEach((v,j)=>{el('label',j?'Жауап':'Сұрақ',f);let t=el('textarea',null,f);t.id='q'+i+'_'+j;t.value=v})});library()}function collect(){let d={subject:$('subject').value.trim(),topic:$('topic').value.trim(),seconds:Number($('seconds').value),names:[0,1].map(i=>$('n'+i).value.trim()),q:Array.from({length:20},(_,i)=>[0,1].map(j=>$('q'+i+'_'+j).value.trim()))};if(!valid(d)||!d.subject||!d.topic){$('status').textContent='Барлық өрістерді дұрыс толтырыңыз.';return false}data=d;return true}$('edit').onclick=()=>{clearInterval(timer);state='ready';fill();$('editor').hidden=false;$('game').hidden=true};$('play').onclick=()=>{if(!$('editor').hidden&&!collect())return;$('editor').hidden=true;$('game').hidden=false;reset()};$('fresh').onclick=()=>{id=null;data=structuredClone(sample);fill()};$('save').onclick=()=>{if(!collect())return;try{let l=lib();id=id||String(Date.now());l[id]=data;localStorage.setItem(key,JSON.stringify(l));library();$('status').textContent='Сақталды.'}catch{$('status').textContent='Сақтау мүмкін болмады.'}};$('load').onclick=()=>{let k=$('library').value,d=lib()[k];if(valid(d)){id=k;data=d;fill();$('status').textContent='Ашылды.'}};$('share').onclick=async()=>{if(!collect())return;let u=new URL(location.href);u.search='';u.hash=encodeURIComponent(JSON.stringify(data));try{await navigator.clipboard.writeText(u.href);$('status').textContent='Сілтеме көшірілді.'}catch{prompt('Сілтемені көшіріңіз:',u.href)}};if(shared){$('nav').remove();$('editor').remove()}reset();</script></html>

<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIZMA — Жеті портал</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#27205a,#090b22 75%);color:#fff;font:16px system-ui;min-height:100vh}main{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{text-align:center;font-size:clamp(32px,6vw,65px);letter-spacing:5px;margin-bottom:0}p{text-align:center;color:#c7c3e4}button,input,textarea{font:inherit}button{cursor:pointer;color:white;background:#5843a4;border:1px solid #a594ef;border-radius:12px;padding:12px 18px}button:hover{filter:brightness(1.2)}#doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:20px;margin:40px 0}.door{height:225px;border:3px solid var(--c);border-radius:75px 75px 12px 12px;background:radial-gradient(ellipse at center,var(--c),#19142f 75%);box-shadow:0 0 22px var(--c),inset 0 0 20px #090b22;display:grid;place-items:center;font-size:30px;text-shadow:0 2px 8px black;transition:transform .25s}.door:hover:not(:disabled){transform:translateY(-8px)}.door:disabled{opacity:.5;cursor:default}section,dialog{background:#1b1937;color:white;border:1px solid #7165a3;border-radius:20px;padding:24px}dialog{width:min(550px,92vw)}dialog::backdrop{background:#050517cc}input,textarea{width:100%;background:#0d1029;color:white;border:1px solid #7165a3;padding:12px;border-radius:8px;margin:6px 0 14px}label{display:block;color:#d9d1ff}#editor>div{border-bottom:1px solid #51486f;padding:15px 0}#msg{min-height:28px;color:#c6ffdb}small{color:#bcb5d9}</style><main><header><b>◇ PRIZMA GAME / 001</b><div><button id="mode">Мұғалім режимі</button> <button id="reset">Қайта бастау</button></div></header><h1>ЖЕТІ ПОРТАЛ</h1><p>Жеті тапсырма. Жеті мүмкіндік. Бір мақсат.</p><section id="play"><b id="score"></b><div id="doors"></div><p id="result"></p></section><section id="edit" hidden><h2>Тапсырмаларды өзгерту</h2><small>Жауаптарды үтір емес, | таңбасымен бөліп, бірнеше дұрыс нұсқа енгізуге болады. Өзгерістер осы браузерде сақталады.</small><div id="editor"></div><button id="save">Сақтау және ойнау</button></section><dialog id="modal"><h2 id="heading"></h2><p id="question"></p><label>Жауабың<input id="answer" autocomplete="off"></label><div id="msg" aria-live="polite"></div><button id="check">Жауапты тексеру</button> <button id="close">Жабу</button></dialog></main><script>const $=id=>document.getElementById(id);const defaults=[['Қазақстанның астанасы?','Астана'],['5 × 7 нешеге тең?','35'],['Судың химиялық формуласы?','H2O|H₂O'],['Абайдың шын есімі?','Ибраһим|Ибраһим Құнанбайұлы'],['Жердің табиғи серігі?','Ай'],['Бір тәулікте неше сағат бар?','24'],['Қазақ әліпбиіндегі бірінші әріп?','А']].map(([q,a])=>({q,a,p:10}));let data=defaults;try{let v=JSON.parse(localStorage.getItem('prizma7'));if(Array.isArray(v)&&v.length===7)data=v}catch{}let done=new Set(),total=0,current=0;const colors=['#9e6aff','#35caff','#45e3ad','#f2c45f','#ff747f','#e38bff','#5e9dff'];function render(){ $('score').textContent=`Ұпай: ${total} / ${data.reduce((s,x)=>s+x.p,0)} · Ашылған портал: ${done.size}/7`; $('doors').replaceChildren();data.forEach((x,i)=>{let b=document.createElement('button');b.className='door';b.style.setProperty('--c',colors[i]);b.textContent=done.has(i)?'✓':String(i+1).padStart(2,'0');b.disabled=done.has(i);b.setAttribute('aria-label',`${i+1}-портал`);b.onclick=()=>{current=i;$('heading').textContent=`${i+1}-портал · ${x.p} ұпай`;$('question').textContent=x.q;$('answer').value='';$('msg').textContent='';$('check').disabled=false;$('modal').showModal();$('answer').focus()};$('doors').append(b)});$('result').textContent=done.size===7?'🎉 Барлық портал ашылды! Құттықтаймыз!':'Порталды таңдап, тапсырманы орындаңыз.'}function norm(s){return s.trim().toLocaleLowerCase('kk').replace(/\s+/g,' ')}$('check').onclick=()=>{let x=data[current];if(done.has(current))return;if(x.a.split('|').some(a=>norm(a)===norm($('answer').value))){done.add(current);total+=x.p;$('msg').textContent='Дұрыс! Портал ашылды.';$('check').disabled=true;render()}else $('msg').textContent='Әзірге дұрыс емес. Тағы байқап көр.'};$('answer').onkeydown=e=>{if(e.key==='Enter')$('check').click()};$('close').onclick=()=>$('modal').close();$('reset').onclick=()=>{done.clear();total=0;render()};$('mode').onclick=()=>{let ed=$('edit');ed.hidden=!ed.hidden;$('play').hidden=!ed.hidden;$('mode').textContent=ed.hidden?'Мұғалім режимі':'Ойын режимі';if(!ed.hidden){$('editor').replaceChildren();data.forEach((x,i)=>{let d=document.createElement('div');d.innerHTML=`<h3>${i+1}-портал</h3><label>Сұрақ<textarea required></textarea></label><label>Дұрыс жауап<input required></label><label>Ұпай<input type="number" min="1" max="100"></label>`;let els=d.querySelectorAll('textarea,input');els[0].value=x.q;els[1].value=x.a;els[2].value=x.p;$('editor').append(d)})}};$('save').onclick=()=>{let next=[...$('editor').children].map(d=>{let a=d.querySelectorAll('textarea,input');return {q:a[0].value.trim(),a:a[1].value.trim(),p:Number(a[2].value)}});if(next.some(x=>!x.q||!x.a||!Number.isInteger(x.p)||x.p<1||x.p>100)){alert('Барлық сұрақ пен жауапты, 1–100 аралығындағы бүтін ұпайды енгізіңіз.');return}data=next;try{localStorage.setItem('prizma7',JSON.stringify(data))}catch{alert('Браузерде сақтау мүмкін болмады.')}done.clear();total=0;$('mode').click();render()};render();</script></html>
